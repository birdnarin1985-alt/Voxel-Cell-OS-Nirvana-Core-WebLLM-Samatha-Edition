<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Cell OS : Grand Rebirth</title>
    <style>
        /* ========================================================
           1. CORE VARIABLES & RESET
           ======================================================== */
        :root {
            --bg-dark: #010203;
            --cyan-core: #00f3ff;
            --cyan-glow: 0 0 15px rgba(0, 243, 255, 0.6);
            --gold-core: #f39c12;
            --gold-glow: 0 0 15px rgba(243, 156, 18, 0.6);
            --alert-core: #e74c3c;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(0, 243, 255, 0.02));
            --glass-border: 1px solid rgba(0, 243, 255, 0.25);
            --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); font-family: 'Segoe UI', Tahoma, sans-serif; color: #f8f9fa; touch-action: none; user-select: none; }
        
        /* 3D CANVAS */
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        
        /* HIDDEN SENSORS */
        #camera-feed, #pixel-buffer-canvas, #doc-buffer-canvas { display: none; }

        /* ========================================================
           2. ULTRA-GLASSMORPHISM UI SPATIAL HIERARCHY
           ======================================================== */
        #ui-root { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 16px; }
        
        /* TOP BAR */
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 460px; margin: 0 auto; pointer-events: auto; }
        
        .glass-badge {
            background: rgba(0, 0, 0, 0.2);
            border: var(--glass-border);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--cyan-core);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--glass-highlight), 0 4px 15px rgba(0,0,0,0.3);
        }
        .glass-badge:hover { background: rgba(0, 243, 255, 0.1); }
        
        .telemetry-group { display: flex; gap: 12px; font-family: 'Courier New', monospace; font-size: 0.7rem; pointer-events: none; }
        
        /* MAIN HUD PANEL (ใสปิ๊งสุดๆ) */
        .hud-panel {
            position: relative;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            background: var(--glass-bg); /* ใสมาก */
            border: var(--glass-border);
            border-top: 1px solid rgba(255,255,255,0.15); /* แสงตกกระทบขอบบน */
            border-left: 1px solid rgba(255,255,255,0.08);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); /* เบลอให้เห็น 3D ชัดขึ้น */
            border-radius: 24px;
            padding: 20px;
            pointer-events: auto;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .hud-panel.hidden { transform: translateY(120%); opacity: 0; pointer-events: none; }

        /* HEADER */
        .hud-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
        .hud-title { color: var(--gold-core); font-weight: 800; font-size: 0.9rem; letter-spacing: 1.5px; text-shadow: var(--gold-glow); text-transform: uppercase; }
        
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: var(--cyan-core); font-weight: bold; }
        .status-dot { width: 8px; height: 8px; background: var(--cyan-core); border-radius: 50%; box-shadow: var(--cyan-glow); animation: pulse 2s infinite; }
        .status-dot.fallback { background: var(--gold-core); box-shadow: var(--gold-glow); animation: none; }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.5; } 50% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.5; } }

        /* DATA INJECTION STREAMER */
        .streamer-box { display: flex; flex-direction: column; gap: 6px; }
        .streamer-text { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--cyan-core); font-family: 'Courier New', monospace; text-shadow: 0 0 5px rgba(0,243,255,0.4); }
        .streamer-text.fallback { color: var(--gold-core); text-shadow: 0 0 5px rgba(243,156,18,0.4); }
        .progress-track { width: 100%; height: 6px; background: rgba(0,0,0,0.4); border-radius: 4px; border: 1px solid rgba(0,243,255,0.2); overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--cyan-core); box-shadow: var(--cyan-glow); transition: width 0.3s ease; }
        .progress-fill.fallback { background: var(--gold-core); box-shadow: var(--gold-glow); }

        /* GRID BUTTONS */
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); }
        .glass-btn.active { background: rgba(0, 243, 255, 0.15); border-color: var(--cyan-core); color: var(--cyan-core); text-shadow: var(--cyan-glow); box-shadow: inset 0 0 10px rgba(0,243,255,0.2); }

        /* AI PROMPT AREA */
        .ai-prompt-area { display: flex; gap: 8px; }
        .glass-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 14px;
            padding: 10px 14px;
            color: var(--cyan-core);
            font-size: 0.75rem;
            outline: none;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .glass-input:focus { border-color: var(--cyan-core); box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), var(--cyan-glow); }
        
        /* LOG CONSOLE */
        .hologram-log {
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.7);
            height: 50px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 12px;
            border-left: 2px solid var(--cyan-core);
            backdrop-filter: blur(4px);
        }
        .log-entry { margin-bottom: 3px; }
        .log-entry.error { color: var(--alert-core); text-shadow: 0 0 5px var(--alert-core); font-weight: bold; }
        .log-entry.sys { color: var(--gold-core); }

        /* AR BUTTON */
        #ARButton { display: none !important; }
        .btn-ar-scan { width: 100%; border-color: #e056fd; color: #e056fd; text-shadow: 0 0 10px #e056fd; background: rgba(224, 86, 253, 0.05); margin-top: 5px; }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <!-- SENSORS & CANVAS -->
    <canvas id="webgl-canvas"></canvas>
    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="pixel-buffer-canvas"></canvas>
    <canvas id="doc-buffer-canvas"></canvas>
    
    <!-- UI OVERLAY -->
    <div id="ui-root">
        
        <!-- TOP BAR -->
        <div class="top-bar">
            <button class="glass-badge" onclick="SYS.toggleHUD()">🌐 สลับโฮโลแกรม</button>
            <div class="glass-badge telemetry-group">
                <span id="fps-display">FPS: 00</span>
                <span id="mem-display">MEM: OK</span>
            </div>
        </div>

        <!-- MAIN HUD -->
        <div class="hud-panel" id="main-hud">
            <div class="hud-header">
                <span class="hud-title">🪷 NIRVANA CORE (3B)</span>
                <div class="status-indicator">
                    <div class="status-dot" id="sys-pulse"></div>
                    <span id="sys-status-text">กำลังตื่นรู้...</span>
                </div>
            </div>

            <!-- DATA INJECTION -->
            <div class="streamer-box">
                <div class="streamer-text" id="stream-text-1">
                    <span id="ai-progress-label">Llama-3.2-3B Model Fetch</span>
                    <span id="ai-progress-pct">0%</span>
                </div>
                <div class="streamer-text" id="stream-text-2">
                    <span id="stream-flow-rate">FLOW: 0.0 MB/s</span>
                    <span id="stream-chunk-status">ABSORB: 0 / 0 MB</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="ai-progress-bar"></div>
                </div>
            </div>
            
            <!-- MODES -->
            <div class="btn-grid">
                <button class="glass-btn active" id="btn-idle" onclick="SYS.switchMode('IDLE')">🧘‍♂️ ฌาน</button>
                <button class="glass-btn" id="btn-stream" onclick="SYS.switchMode('STREAM')">👁️ ตาทิพย์</button>
                <button class="glass-btn" id="btn-doc" onclick="SYS.switchMode('DOC')">📄 เอกสาร</button>
            </div>

            <div class="btn-grid">
                <button class="glass-btn" onclick="alert('Digital Magazine: Coming Soon')">📖 นิตยสาร</button>
                <button class="glass-btn" id="btn-speech" onclick="SYS.toggleSpeech()">🔊 เสียง: ปิด</button>
                <button class="glass-btn" onclick="SYS.syncMyco()">🍄 ซิงค์จิต</button>
            </div>

            <!-- PROMPT -->
            <div class="ai-prompt-area">
                <input type="text" id="ai-prompt" class="glass-input" placeholder="ป้อนคำถามถึงโครงข่าย...">
                <button class="glass-btn" style="color:var(--cyan-core); border-color:var(--cyan-core);" onclick="SYS.sendPrompt()">ส่งจิต</button>
            </div>

            <button class="glass-btn btn-ar-scan" id="btn-ar">🌌 เปิดมิติสแกน AR (LiDAR)</button>
            
            <!-- CONSOLE LOG -->
            <div class="hologram-log" id="sys-log"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        /* ========================================================
           1. DATA STRUCTURE: YONISO GRAPH
           ======================================================== */
        class RecursiveGraphNode {
            constructor(id, type, payload = {}) {
                this.id = id; this.type = type; this.payload = payload; this.pointers = new Map();
            }
            serialize() {
                const links = {}; this.pointers.forEach((v, k) => links[k] = v.id);
                return JSON.stringify({ id: this.id, type: this.type, payload: this.payload, links });
            }
        }
        const rootGraph = new RecursiveGraphNode("ROOT", "NIRVANA_3B_CORE", { version: "Ultra-Glass" });

        /* ========================================================
           2. SYSTEM STATE & LOGGER
           ======================================================== */
        window.SYS = {
            mode: 'IDLE',
            aiEngine: null,
            aiReady: false,
            isFallback: false,
            speechEnabled: false,
            logs: [],
            downloadProgress: 0,
            touch: { x: -999, y: -999, active: false },
            
            log: function(msg, type = 'normal') {
                const time = new Date().toLocaleTimeString();
                this.logs.push({ time, msg, type });
                if (this.logs.length > 5) this.logs.shift();
                
                const logEl = document.getElementById('sys-log');
                logEl.innerHTML = this.logs.map(l => {
                    let c = l.type === 'error' ? 'error' : (l.type === 'sys' ? 'sys' : '');
                    return `<div class="log-entry ${c}">[${l.time}] ${l.msg}</div>`;
                }).join('');
                logEl.scrollTop = logEl.scrollHeight;
                
                // Also log to real console for debugging
                if(type === 'error') console.error(`[Nirvana] ${msg}`);
                else console.log(`[Nirvana] ${msg}`);
            },
            
            toggleHUD: function() {
                document.getElementById('main-hud').classList.toggle('hidden');
            },

            toggleSpeech: function() {
                this.speechEnabled = !this.speechEnabled;
                document.getElementById('btn-speech').innerText = this.speechEnabled ? "🔊 เสียง: เปิด" : "🔇 เสียง: ปิด";
                if(this.speechEnabled) this.speak("เปิดระบบสื่อสารด้วยเสียง");
            },

            speak: function(text) {
                if(!this.speechEnabled || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH'; utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            },

            syncMyco: function() {
                this.log(`ซิงค์ข้อมูลกราฟ ${rootGraph.serialize().length} bytes`, 'sys');
                this.speak("ซิงค์สภาวะจิตสำเร็จ");
            },

            switchMode: async function(target) {
                if(this.mode === target) return;
                document.querySelectorAll('.btn-grid .glass-btn').forEach(b => b.classList.remove('active'));
                if(target !== 'AR') document.getElementById(`btn-${target.toLowerCase()}`).classList.add('active');
                
                stopSensors(); this.mode = target;
                if(target === 'IDLE') { CORE_3D.coreGroup.visible = true; CORE_3D.voxelMesh.visible = false; this.log("กลับสู่สภาวะฌาน (IDLE)"); }
                else if(target === 'STREAM') { await startCamera(); }
                else if(target === 'DOC') { await startDocument(); }
            },

            sendPrompt: async function() {
                const input = document.getElementById('ai-prompt');
                const prompt = input.value.trim();
                if(!prompt) return;
                this.log(`> User: ${prompt}`);
                input.value = '';

                if (this.aiReady && this.aiEngine && !this.isFallback) {
                    try {
                        const reply = await this.aiEngine.chat.completions.create({
                            messages: [{ role: "user", content: `ตอบสั้นๆ ภาษาไทย: ${prompt}` }]
                        });
                        const ans = reply.choices[0].message.content;
                        this.log(`🤖 AI: ${ans}`, 'sys');
                        this.speak(ans);
                    } catch(e) {
                        this.log(`AI Error: ${e.message}`, 'error');
                        this.speak("เกิดข้อผิดพลาดในการประมวลผลคำตอบ");
                    }
                } else {
                    // Fallback response
                    const fallbackAns = `(โหมดสำรอง) รับทราบคำสั่ง: "${prompt}" ระบบบันทึกลงกราฟแล้ว`;
                    this.log(`🤖 AI: ${fallbackAns}`, 'sys');
                    this.speak(fallbackAns);
                }
            }
        };

        /* ========================================================
           3. WEBLLM ENGINE (THE TRUTH REVEALER)
           ======================================================== */
        let lastByteLoaded = 0, lastCheckTime = performance.now();
        
        function updateUIProgress(pct, text, isFallback = false) {
            SYS.downloadProgress = pct / 100;
            document.getElementById('ai-progress-pct').innerText = `${pct}%`;
            document.getElementById('ai-progress-bar').style.width = `${pct}%`;
            document.getElementById('ai-progress-label').innerText = text.length > 25 ? text.substring(0, 25) + '...' : text;
            
            if (isFallback) {
                document.getElementById('sys-status-text').innerText = "โหมดสำรอง (Fallback Active)";
                document.getElementById('sys-status-text').style.color = "var(--gold-core)";
                document.getElementById('sys-pulse').className = "status-dot fallback";
                document.getElementById('ai-progress-bar').className = "progress-fill fallback";
                document.querySelectorAll('.streamer-text').forEach(el => el.classList.add('fallback'));
            }
        }

        async function initWebLLM() {
            try {
                SYS.log("กำลังเชื่อมต่อ WebLLM (3B)...", "sys");
                updateUIProgress(5, "Initiating WebGPU...");

                SYS.aiEngine = await webllm.CreateEngine("Llama-3.2-3B-Instruct-q4f32_1-MLC", {
                    initProgressCallback: (report) => {
                        let match = report.text.match(/(\d+)(%)/);
                        let pct = match ? parseInt(match[1]) : 10;
                        updateUIProgress(pct, report.text);
                        
                        // Fake byte calculation for streamer visual
                        let mockBytes = Math.round((pct / 100) * 3000 * 1024 * 1024);
                        const now = performance.now();
                        const dt = (now - lastCheckTime) / 1000;
                        if (dt >= 0.5 && mockBytes > 0) {
                            const mbPerSec = ((mockBytes - lastByteLoaded) / (1024 * 1024)) / dt;
                            document.getElementById('stream-flow-rate').innerText = `FLOW: ${mbPerSec.toFixed(1)} MB/s`;
                            document.getElementById('stream-chunk-status').innerText = `ABSORB: ${(mockBytes/(1024*1024)).toFixed(0)} / 3000 MB`;
                            lastByteLoaded = mockBytes; lastCheckTime = now;
                        }
                    }
                });
                
                SYS.aiReady = true;
                SYS.isFallback = false;
                updateUIProgress(100, "ตื่นรู้อย่างสมบูรณ์ (3B Ready)");
                document.getElementById('sys-status-text').innerText = "ตื่นรู้ (Ready)";
                SYS.log("โหลดโมเดล Llama-3.2-3B สำเร็จ!", "sys");
                
            } catch (err) {
                // THE TRUTH REVEALER: Log error to console explicitly
                console.error("🔥 [สัจธรรมปรากฏ] WebLLM Initialization Failed:", err);
                
                SYS.isFallback = true;
                SYS.aiReady = false;
                updateUIProgress(100, "WebGPU ถูกจำกัดการเข้าถึง", true);
                document.getElementById('stream-flow-rate').innerText = "FLOW: Bypassed";
                document.getElementById('stream-chunk-status').innerText = "ABSORB: Simulation Mode";
                
                SYS.log(`เข้าสู่โหมดสำรอง (Fallback) เนื่องจาก: ${err.message.substring(0, 30)}...`, "error");
            }
        }

        /* ========================================================
           4. THREE.JS ENGINE (CORE_3D)
           ======================================================== */
        const CORE_3D = {
            scene: null, camera: null, renderer: null, composer: null,
            coreGroup: null, coreMat: null, voxelMesh: null,
            reticle: null, xrController: null, voxelsAR: [], gravity: -9.8
        };

        function init3D() {
            CORE_3D.scene = new THREE.Scene(); 
            CORE_3D.scene.fog = new THREE.FogExp2(0x010203, 0.04);
            
            CORE_3D.camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
            CORE_3D.camera.position.z = 8;

            CORE_3D.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
            CORE_3D.renderer.setSize(window.innerWidth, window.innerHeight);
            CORE_3D.renderer.setPixelRatio(window.devicePixelRatio);
            CORE_3D.renderer.xr.enabled = true; 

            // Post Processing (Bloom for Hologram effect)
            CORE_3D.composer = new EffectComposer(CORE_3D.renderer);
            CORE_3D.composer.addPass(new RenderPass(CORE_3D.scene, CORE_3D.camera));
            CORE_3D.composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.5, 0.4, 0.1));

            // Voxel Instanced Mesh (For Stream/Doc)
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.8 });
            CORE_3D.voxelMesh = new THREE.InstancedMesh(boxGeo, boxMat, 20000);
            CORE_3D.voxelMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            CORE_3D.voxelMesh.visible = false;
            CORE_3D.scene.add(CORE_3D.voxelMesh);

            // TorusKnot Core (For Idle/Data Injection)
            CORE_3D.coreGroup = new THREE.Group();
            CORE_3D.coreMat = new THREE.MeshBasicMaterial({color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.8});
            CORE_3D.coreGroup.add(new THREE.Mesh(new THREE.TorusKnotGeometry(1.8, 0.5, 120, 20), CORE_3D.coreMat));
            CORE_3D.coreGroup.add(new THREE.PointLight(0x00f3ff, 2, 20));
            CORE_3D.scene.add(CORE_3D.coreGroup);
            CORE_3D.scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1));

            // WebXR Setup
            const arBtn = document.getElementById('btn-ar');
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                    if (supported) {
                        const arBtnInternal = ARButton.createButton(CORE_3D.renderer, { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: document.getElementById('ui-root') } });
                        document.body.appendChild(arBtnInternal);
                        arBtn.onclick = () => { arBtnInternal.click(); arBtn.style.display = 'none'; SYS.mode = 'AR'; stopSensors(); };
                    } else { arBtn.innerText = '🚫 AR ไม่รองรับบนอุปกรณ์นี้'; arBtn.style.opacity = 0.5; }
                });
            } else { arBtn.innerText = '🚫 เบราว์เซอร์ไม่มี WebXR'; arBtn.style.opacity = 0.5; }

            CORE_3D.reticle = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color: 0xf39c12}));
            CORE_3D.reticle.matrixAutoUpdate = false; CORE_3D.reticle.visible = false; CORE_3D.scene.add(CORE_3D.reticle);
            
            CORE_3D.xrController = CORE_3D.renderer.xr.getController(0);
            CORE_3D.xrController.addEventListener('select', spawnARVoxel); CORE_3D.scene.add(CORE_3D.xrController);

            // Events
            const updateTouch = (e) => {
                let cx = e.touches ? e.touches[0].clientX : e.clientX; let cy = e.touches ? e.touches[0].clientY : e.clientY;
                SYS.touch.x = ((cx/window.innerWidth)*2-1)*8; SYS.touch.y = (-(cy/window.innerHeight)*2+1)*6;
            };
            window.addEventListener('mousemove', updateTouch); window.addEventListener('touchmove', updateTouch);
            window.addEventListener('mousedown', () => SYS.touch.active = true); window.addEventListener('mouseup', ()=>SYS.touch.active=false);
            window.addEventListener('touchstart', () => SYS.touch.active = true); window.addEventListener('touchend', ()=>SYS.touch.active=false);
            window.addEventListener('resize', () => { 
                CORE_3D.camera.aspect = window.innerWidth/window.innerHeight; CORE_3D.camera.updateProjectionMatrix(); 
                CORE_3D.renderer.setSize(window.innerWidth, window.innerHeight); CORE_3D.composer.setSize(window.innerWidth, window.innerHeight); 
            });

            CORE_3D.renderer.setAnimationLoop(renderLoop);
        }

        /* ========================================================
           5. SENSORS (AUDIO & VIDEO)
           ======================================================== */
        const videoEl = document.getElementById('camera-feed'); 
        const bufCanvas = document.getElementById('pixel-buffer-canvas'); 
        const docCanvas = document.getElementById('doc-buffer-canvas');
        let streamTrack = null, audioCtx, analyser, dataArray;
        const res = { w: 100, h: 75, spacing: 0.12, size: 0.09 }; // Optimized resolution

        async function initAudio() {
            if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); analyser = audioCtx.createAnalyser(); analyser.fftSize = 64; dataArray = new Uint8Array(analyser.frequencyBinCount); }
            if(audioCtx.state === 'suspended') await audioCtx.resume();
            try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); audioCtx.createMediaStreamSource(stream).connect(analyser); } catch(e) {}
        }

        function stopSensors() {
            if(streamTrack) { streamTrack.stop(); streamTrack = null; }
            videoEl.srcObject = null; CORE_3D.coreGroup.visible = false; CORE_3D.voxelMesh.visible = false; CORE_3D.reticle.visible = false;
        }

        async function startCamera() {
            await initAudio();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320 } });
                videoEl.srcObject = stream; streamTrack = stream.getVideoTracks()[0];
                await new Promise(r => videoEl.onloadedmetadata = r); videoEl.play();
                bufCanvas.width = res.w; bufCanvas.height = res.h; CORE_3D.voxelMesh.visible = true; SYS.log("เปิดเนตร (Camera) สำเร็จ");
            } catch (err) { SYS.log(`Camera Error: ${err.message}`, "error"); }
        }

        async function startDocument() {
            await initAudio(); docCanvas.width = res.w; docCanvas.height = res.h;
            const ctx = docCanvas.getContext('2d'); ctx.fillStyle = 'black'; ctx.fillRect(0,0, res.w, res.h);
            ctx.fillStyle = '#00f3ff'; ctx.font = 'bold 12px Courier'; ctx.fillText("VOXEL DOC", 5, 25);
            ctx.fillStyle = '#ffffff'; ctx.font = '8px Courier'; ctx.fillText("TARGET: Local Memory", 5, 40);
            ctx.fillStyle = '#f39c12'; ctx.font = 'bold 14px Courier'; ctx.fillText("STATUS: ACTIVE", 5, 60);
            CORE_3D.voxelMesh.visible = true; SYS.log("สร้างเอกสารโฮโลแกรม");
        }

        function spawnARVoxel() {
            if (!CORE_3D.reticle.visible) return;
            const col = new THREE.Color().setHSL(Math.random(), 1.0, 0.5);
            const v = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshStandardMaterial({color: col, emissive: col, emissiveIntensity: 0.5}));
            CORE_3D.reticle.matrix.decompose(v.position, v.quaternion, v.scale); v.position.y += 0.5; 
            v.userData = { vel: new THREE.Vector3((Math.random()-0.5)*0.5, 0, (Math.random()-0.5)*0.5), floorY: CORE_3D.reticle.position.y, bounces: 0 };
            CORE_3D.scene.add(v); CORE_3D.voxelsAR.push(v);
        }

        /* ========================================================
           6. MAIN RENDER LOOP
           ======================================================== */
        let time = 0, lastTime = 0, frameCount = 0, fpsTimer = 0;
        const dummy = new THREE.Object3D(); const colorTemp = new THREE.Color();

        function renderLoop(timestamp, frame) {
            const dt = (timestamp - lastTime) * 0.001 || 0; lastTime = timestamp; time += 0.05;

            // Telemetry update
            frameCount++; fpsTimer += dt;
            if (fpsTimer >= 1.0) {
                document.getElementById('fps-display').innerText = `FPS: ${Math.round(frameCount / fpsTimer)}`;
                if (performance.memory) document.getElementById('mem-display').innerText = `MEM: ${Math.round(performance.memory.usedJSHeapSize / (1024*1024))}MB`;
                frameCount = 0; fpsTimer = 0;
            }

            // Audio Bass calculation
            let audioBass = 0; if(analyser) { analyser.getByteFrequencyData(dataArray); audioBass = (dataArray[0]+dataArray[1])/510.0; }

            // AR Mode Logic
            if (SYS.mode === 'AR') {
                if(frame) {
                    const refSpace = CORE_3D.renderer.xr.getReferenceSpace(); const session = CORE_3D.renderer.xr.getSession();
                    if(!SYS.arRequested) {
                        session.requestReferenceSpace('viewer').then(ref => session.requestHitTestSource({space:ref}).then(src => SYS.arHitSource = src));
                        session.addEventListener('end', () => { SYS.arRequested=false; SYS.arHitSource=null; document.getElementById('btn-ar').style.display='block'; SYS.switchMode('IDLE'); });
                        SYS.arRequested = true;
                    }
                    if(SYS.arHitSource) {
                        const hits = frame.getHitTestResults(SYS.arHitSource);
                        if(hits.length > 0) { CORE_3D.reticle.visible = true; CORE_3D.reticle.matrix.fromArray(hits[0].getPose(refSpace).transform.matrix); } else { CORE_3D.reticle.visible = false; }
                    }
                }
                CORE_3D.voxelsAR.forEach(v => {
                    if(v.userData.bounces < 5) {
                        v.userData.vel.y += CORE_3D.gravity * dt; v.position.addScaledVector(v.userData.vel, dt);
                        v.rotation.x += v.userData.vel.y * dt * 2; v.rotation.y += v.userData.vel.x * dt * 2;
                        if(v.position.y <= v.userData.floorY + 0.05) {
                            v.position.y = v.userData.floorY + 0.05; v.userData.vel.y = Math.abs(v.userData.vel.y) * 0.6; 
                            v.userData.vel.x *= 0.8; v.userData.vel.z *= 0.8; v.userData.bounces++;
                        }
                    }
                });
                CORE_3D.renderer.render(CORE_3D.scene, CORE_3D.camera); return;
            }

            // IDLE Mode Logic (Data Injection Effect)
            if(SYS.mode === 'IDLE' && CORE_3D.coreGroup.visible) {
                let speed = 1.0 + (1.0 - SYS.downloadProgress) * 4.0; 
                CORE_3D.coreGroup.rotation.y += 0.005 * speed; CORE_3D.coreGroup.rotation.x += 0.002 * speed;
                let scale = 1 + audioBass * 0.5 + Math.sin(time * 3) * (0.05 * (1.0 - SYS.downloadProgress));
                CORE_3D.coreGroup.children[0].scale.setScalar(scale);
                
                // Color swap based on status
                let targetColor = SYS.isFallback ? 0xf39c12 : (SYS.downloadProgress >= 1.0 ? 0xf39c12 : 0x00f3ff);
                CORE_3D.coreMat.color.setHex(targetColor);
                CORE_3D.coreGroup.children[1].color.setHex(targetColor);
                
                CORE_3D.composer.render(); return;
            }

            // STREAM / DOC Mode Logic (Voxel Processing)
            const ctx = (SYS.mode === 'STREAM') ? bufCanvas.getContext('2d', {willReadFrequently:true}) : docCanvas.getContext('2d', {willReadFrequently:true});
            if(SYS.mode === 'STREAM') ctx.drawImage(videoEl, 0, 0, res.w, res.h);
            const imgData = ctx.getImageData(0,0,res.w,res.h).data;
            const oX = (res.w * res.spacing)/2; const oY = (res.h * res.spacing)/2;
            let idx = 0;
            
            for(let y=0; y<res.h; y+=2){ // skip pixels for performance
                for(let x=0; x<res.w; x+=2){
                    const i = (y*res.w+x)*4; const r = imgData[i]; const g = imgData[i+1]; const b = imgData[i+2];
                    const bright = (r*0.299 + g*0.587 + b*0.114)/255; if(bright < 0.1) continue;

                    let pX = ((SYS.mode === 'STREAM' ? res.w-x-1 : x) * res.spacing) - oX; 
                    let pY = -(y * res.spacing) + oY;
                    let pZ = bright * 2.0 + audioBass * 1.5;
                    
                    if(SYS.touch.active) {
                        let dx = pX - SYS.touch.x; let dy = pY - SYS.touch.y; let dist = Math.sqrt(dx*dx + dy*dy);
                        if(dist < 3.0) { let f = (3.0-dist)*1.5; pX += (dx/dist)*f; pY += (dy/dist)*f; pZ += f*2; }
                    }

                    dummy.position.set(pX, pY, pZ); dummy.scale.setScalar(res.size * (0.8 + audioBass*0.6)); dummy.updateMatrix();
                    CORE_3D.voxelMesh.setMatrixAt(idx, dummy.matrix); 
                    colorTemp.setRGB(r/255, g/255, b/255); CORE_3D.voxelMesh.setColorAt(idx, colorTemp); 
                    idx++;
                }
            }
            CORE_3D.voxelMesh.count = idx; CORE_3D.voxelMesh.instanceMatrix.needsUpdate = true; CORE_3D.voxelMesh.instanceColor.needsUpdate = true;
            CORE_3D.voxelMesh.rotation.y = Math.sin(time*0.02)*0.1; CORE_3D.voxelMesh.rotation.x = Math.cos(time*0.015)*0.05;
            CORE_3D.composer.render(); 
        }

        // --- BOOTSTRAP ---
        SYS.log("บูตระบบ Voxel Cell OS : Grand Rebirth", "sys");
        init3D();
        initWebLLM();
    </script>
</body>
