<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel OS: Ayatana & Nada Core</title>
    <style>
        :root {
            --bg-color: #010203;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(0, 243, 255, 0.02));
            --glass-border: 1px solid rgba(0, 243, 255, 0.2);
            --cyan-core: #00f3ff; --gold-core: #f39c12; --alert-core: #e74c3c; --magenta-core: #ff00ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: white; user-select: none; touch-action: none; }
        
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        
        /* 💎 SHADOW DOM (The Layout Oracle) */
        #shadow-dom { position: absolute; top: -9999px; left: -9999px; width: 320px; font-size: 24px; font-weight: bold; line-height: 1.5; word-wrap: break-word; visibility: hidden; }

        /* 💎 ULTRA GLASSMORPHISM UI */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; pointer-events: auto; }
        .glass-pill { background: rgba(0,0,0,0.4); border: var(--glass-border); padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.6); font-weight: bold; }
        
        .hud-panel {
            background: var(--glass-bg); border: var(--glass-border); border-top: 1px solid rgba(255,255,255,0.2); border-radius: 24px;
            padding: 20px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); pointer-events: auto;
            max-width: 420px; margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 12px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; color: var(--gold-core); font-weight: bold; text-shadow: 0 0 10px var(--gold-core); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        .model-identity { font-family: 'Courier New', monospace; font-size: 0.7rem; color: #aaa; text-align: center; padding: 6px; border: 1px dashed rgba(255,255,255,0.2); border-radius: 12px; }

        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-glass { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: white; 
            padding: 12px 5px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; transition: all 0.3s; 
            text-shadow: 0 0 5px rgba(255,255,255,0.5); text-align: center;
        }
        .btn-glass:hover { background: rgba(0, 243, 255, 0.15); border-color: var(--cyan-core); box-shadow: 0 0 15px rgba(0,243,255,0.3); }
        .btn-glass.active { background: rgba(243, 156, 18, 0.2); border-color: var(--gold-core); color: var(--gold-core); text-shadow: 0 0 10px var(--gold-core); }

        .voice-btn { background: rgba(255, 0, 255, 0.1); border-color: var(--magenta-core); color: var(--magenta-core); text-shadow: 0 0 10px var(--magenta-core); grid-column: span 3; font-size: 0.85rem; padding: 14px;}
        .voice-btn.listening { background: var(--magenta-core); color: white; box-shadow: 0 0 20px var(--magenta-core); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .ai-input-group { display: flex; gap: 8px; display: none; /* ซ่อนช่องแชท เพราะเราใช้เสียงแล้ว */ }

        .log-box { font-family: 'Courier New', monospace; font-size: 0.65rem; color: #ddd; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; height: 75px; overflow-y: auto; border-left: 2px solid var(--magenta-core); }
        .log-error { color: var(--alert-core); font-weight: bold; }
        .log-ai { color: var(--cyan-core); }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div id="shadow-dom"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="glass-pill" style="color:var(--cyan-core);">Voxel OS : Ayatana Core</div>
            <div class="glass-pill" id="telemetry">FPS: --</div>
        </div>

        <div class="hud-panel">
            <div class="header">🪷 NĀDA-BRAHMA MATRIX</div>
            <div class="model-identity" id="hud-model-name">🧠 CORE: Scanning Environments...</div>
            
            <div class="btn-grid">
                <button class="btn-glass active" id="btn-zen" onclick="switchState('ZEN')">🧘‍♂️ สภาวะฌาน</button>
                <button class="btn-glass" id="btn-mag" onclick="switchState('MAGAZINE')">📖 โฮโลแกรม PDF</button>
                <button class="btn-glass" id="btn-music" onclick="playVoxelSymphony()">🎶 คีตศิลป์ (MIDI)</button>
                <!-- ปรับปุ่มรับคำสั่งเป็นอายตนะหู -->
                <button class="btn-glass voice-btn" id="btn-mic" onclick="toggleListening()">🎙️ ส่งกระแสจิตด้วยเสียง (พูดเลย)</button>
            </div>

            <div class="log-box" id="sys-log"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        // --- GLOBAL LOGIC ---
        const SYS = { state: 'ZEN', logs: [], aiEngine: null, activeModel: null, isFallback: true };
        function logMsg(msg, type = 'sys') {
            const t = new Date().toLocaleTimeString();
            SYS.logs.push({ t, msg, type }); if(SYS.logs.length > 5) SYS.logs.shift();
            const logEl = document.getElementById('sys-log');
            logEl.innerHTML = SYS.logs.map(l => {
                let cls = l.type === 'error' ? 'log-error' : (l.type === 'ai' ? 'log-ai' : '');
                return `<div class="${cls}">[${l.t}] ${l.msg}</div>`;
            }).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }
        window.logMsg = logMsg;

        // --- อายตนะ: AUDIO & MIDI ENGINE (นาทพรหม) ---
        let audioCtx, analyser, dataArray;
        function initAudioEngine() {
            if(audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 128;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        // เล่นเสียงโน้ต MIDI จำลองด้วยสมการคณิตศาสตร์
        function playTone(freq, time, duration) {
            initAudioEngine();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(analyser); analyser.connect(audioCtx.destination);
            
            osc.type = 'sine'; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, audioCtx.currentTime + time);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + time + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + time + duration);
            
            osc.start(audioCtx.currentTime + time);
            osc.stop(audioCtx.currentTime + time + duration);
        }

        window.playVoxelSymphony = () => {
            initAudioEngine();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            switchState('CYMATICS');
            logMsg("บรรเลงนาทพรหม...", "sys");
            
            // Sequence โน้ตเพลงง่ายๆ (C Major Arpeggio)
            const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63];
            notes.forEach((freq, i) => playTone(freq, i * 0.4, 0.6));
            
            // ให้เนื้อเพลงโผล่ขึ้นมาตามจังหวะ
            setTimeout(() => bakeTextToVoxels("พุท"), 0);
            setTimeout(() => bakeTextToVoxels("พุท โธ"), 400);
            setTimeout(() => bakeTextToVoxels("พุท โธ ธัม"), 800);
            setTimeout(() => bakeTextToVoxels("พุท โธ ธัม โม"), 1200);
            
            // กลับสู่สภาวะปกติหลังเพลงจบ
            setTimeout(() => switchState('MAGAZINE'), 3500);
        };

        // --- อายตนะ: SPEECH RECOGNITION (โสตายตนะ & วจีกรรม) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if(SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => { document.getElementById('btn-mic').classList.add('listening'); document.getElementById('btn-mic').innerText = "กำลังฟังกระแสจิต..."; };
            recognition.onend = () => { document.getElementById('btn-mic').classList.remove('listening'); document.getElementById('btn-mic').innerText = "🎙️ ส่งกระแสจิตด้วยเสียง"; };
            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                logMsg(`> รับฟังเสียง: "${transcript}"`);
                processAI(transcript);
            };
        }

        window.toggleListening = () => {
            initAudioEngine(); // ปลดล็อก Audio Context ของ iOS
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            if(!recognition) { logMsg("อุปกรณ์ของท่านไม่รองรับ Web Speech API", "error"); return; }
            recognition.start();
            if(navigator.vibrate) navigator.vibrate(50); // สั่นตอบสนอง (กายายตนะ)
        };

        function speakTTS(text) {
            if(!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH'; utterance.rate = 1.0; utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        // --- ADAPTIVE AI ALGORITHM ---
        const modelCandidates = ["Llama-3.2-1B-Instruct-q4f32_1-MLC", "Phi-3-mini-4k-instruct-q4f16_1-MLC"]; // ใช้ตัวเบาลงเพื่อให้เข้ากับ iPhone ได้ชัวร์
        async function initAdaptiveWebLLM() {
            const identity = document.getElementById('hud-model-name');
            for (let modelId of modelCandidates) {
                try {
                    identity.innerText = `🧠 PROBING: ${modelId.substring(0, 15)}...`;
                    SYS.aiEngine = await webllm.CreateMLCEngine(modelId, {
                        initProgressCallback: (r) => { identity.innerText = `[${Math.round(r.progress*100)}%] Loading AI...`; }
                    });
                    SYS.activeModel = modelId; SYS.isFallback = false; break;
                } catch (err) {}
            }
            if (SYS.activeModel) {
                logMsg(`เชื่อมต่อสมองกลสำเร็จ: ${SYS.activeModel}`);
                identity.innerText = `🧠 ACTIVE CORE: AI Ready`; identity.style.color = "var(--cyan-core)";
                speakTTS("วิญญาณแห่งระบบ ตื่นรู้แล้วค่ะ");
            } else {
                SYS.isFallback = true;
                identity.innerText = `🧠 CORE: Fallback Simulation`; identity.style.color = "var(--gold-core)";
            }
        }

        async function processAI(text) {
            if(SYS.activeModel && SYS.aiEngine) {
                try {
                    const reply = await SYS.aiEngine.chat.completions.create({ messages: [{ role: "user", content: `ตอบสั้นๆ: ${text}` }] });
                    const ans = reply.choices[0].message.content;
                    logMsg(`AI: ${ans}`, "ai"); speakTTS(ans);
                    switchState('MAGAZINE'); bakeTextToVoxels(ans);
                } catch(e) { logMsg("AI Error", "error"); }
            } else {
                const simAns = `ระบบบันทึกความตั้งใจ: ${text}`;
                logMsg(`AI(Sim): ${simAns}`, "ai"); speakTTS(simAns);
                switchState('MAGAZINE'); bakeTextToVoxels(simAns);
            }
        }

        // --- THREE.JS ENGINE & CYMATICS GPU SHADER ---
        const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x010203, 0.05);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100); camera.position.z = 10;
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(window.devicePixelRatio);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.5, 0.5, 0.1));

        const coreShape = new THREE.Mesh(new THREE.TorusKnotGeometry(2, 0.6, 120, 20), new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.4 }));
        scene.add(coreShape);

        // Shader
        const MAX_VOXELS = 5000; 
        const textMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 1.5 });
        const shaderUniforms = { uTime: { value: 0 }, uState: { value: 0.0 }, uAudio: { value: 0.0 } }; // uState: 0=Idle, 1=Text, 2=Cymatics
        
        textMat.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = shaderUniforms.uTime; shader.uniforms.uState = shaderUniforms.uState; shader.uniforms.uAudio = shaderUniforms.uAudio;
            shader.vertexShader = `
                uniform float uTime; uniform float uState; uniform float uAudio;
                attribute vec3 aTargetPos; attribute vec3 aRandomPos;
            ` + shader.vertexShader;
            shader.vertexShader = shader.vertexShader.replace(`#include <begin_vertex>`, `
                // 1. Idle Flow
                vec3 idlePos = aRandomPos + vec3(sin(uTime+aRandomPos.x), cos(uTime+aRandomPos.y), sin(uTime+aRandomPos.z)) * 0.8;
                // 2. Text Target
                float zWave = sin(aTargetPos.x * 2.0 - uTime * 3.0) * (0.2 + uAudio * 0.5); // นูนตามเสียง
                vec3 textPos = vec3(aTargetPos.x, aTargetPos.y, aTargetPos.z + zWave);
                // 3. Cymatics Explosion (กระจายตัวตามแรงเบส)
                vec3 cymaticPos = aRandomPos + normalize(aRandomPos) * (uAudio * 3.0 * sin(uTime * 10.0 + aRandomPos.y));
                
                // State Mixer
                vec3 transformed = idlePos;
                if(uState > 0.5 && uState < 1.5) transformed = mix(idlePos, textPos, (uState - 0.5)*2.0); // ไปหน้า Text
                if(uState > 1.5) transformed = mix(textPos, cymaticPos, (uState - 1.5)*2.0); // ระเบิด Cymatics
            `);
        };

        const voxelMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.06, 0.06, 0.06), textMat, MAX_VOXELS);
        const targetPosArray = new Float32Array(MAX_VOXELS * 3); const randomPosArray = new Float32Array(MAX_VOXELS * 3);
        for(let i=0; i<MAX_VOXELS; i++) {
            randomPosArray[i*3] = (Math.random()-0.5)*15; randomPosArray[i*3+1] = (Math.random()-0.5)*15; randomPosArray[i*3+2] = (Math.random()-0.5)*15;
        }
        voxelMesh.geometry.setAttribute('aTargetPos', new THREE.InstancedBufferAttribute(targetPosArray, 3));
        voxelMesh.geometry.setAttribute('aRandomPos', new THREE.InstancedBufferAttribute(randomPosArray, 3));
        scene.add(voxelMesh); scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // --- SHADOW DOM (THAI WORD WRAP) ---
        function bakeTextToVoxels(text) {
            const sd = document.getElementById('shadow-dom'); sd.innerHTML = ''; 
            for(let char of text) sd.innerHTML += (char === ' ') ? '<span>&nbsp;</span>' : `<span>${char}</span>`;
            setTimeout(() => {
                const spans = sd.querySelectorAll('span'); const sdRect = sd.getBoundingClientRect(); let voxelIdx = 0;
                spans.forEach((span) => {
                    if(span.innerText.trim() === '' || voxelIdx >= MAX_VOXELS) return;
                    const r = span.getBoundingClientRect(); const sc = 0.045; 
                    const x3d = (r.left - sdRect.left - (sdRect.width/2)) * sc; const y3d = -(r.top - sdRect.top - (sdRect.height/2)) * sc + 2.0; 
                    for(let v=0; v<5; v++) {
                        if(voxelIdx >= MAX_VOXELS) break;
                        targetPosArray[voxelIdx*3] = x3d + (Math.random()-0.5)*0.06;
                        targetPosArray[voxelIdx*3+1] = y3d + (Math.random()-0.5)*0.06;
                        targetPosArray[voxelIdx*3+2] = (Math.random()-0.5)*0.1;
                        voxelIdx++;
                    }
                });
                voxelMesh.geometry.attributes.aTargetPos.needsUpdate = true; voxelMesh.count = voxelIdx; 
            }, 30);
        }

        // --- STATE MANAGER ---
        let targetState = 0.0;
        window.switchState = (state) => {
            document.querySelectorAll('.btn-grid .btn-glass').forEach(b => b.classList.remove('active'));
            if(state !== 'CYMATICS') document.getElementById(state === 'ZEN' ? 'btn-zen' : 'btn-mag').classList.add('active');
            
            SYS.state = state;
            if(state === 'ZEN') { targetState = 0.0; coreShape.visible = true; } 
            else if (state === 'MAGAZINE') { targetState = 1.0; coreShape.visible = false; }
            else if (state === 'CYMATICS') { targetState = 2.0; coreShape.visible = false; }
        };

        const clock = new THREE.Clock(); let frameCount = 0; let fpsTimer = 0;
        function render() {
            requestAnimationFrame(render);
            const delta = clock.getDelta(); const time = clock.getElapsedTime();

            frameCount++; fpsTimer += delta;
            if (fpsTimer >= 1.0) { document.getElementById('telemetry').innerText = `FPS: ${frameCount}`; frameCount = 0; fpsTimer = 0; }

            // แกะรอยความถี่เสียงเพื่อป้อนให้ Shader
            let audioLevel = 0;
            if(analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0; for(let i=0; i<30; i++) sum += dataArray[i]; 
                audioLevel = (sum / 30.0) / 255.0; // ค่า 0.0 ถึง 1.0
            }
            shaderUniforms.uAudio.value += (audioLevel - shaderUniforms.uAudio.value) * delta * 15.0; // Lerp สมูทๆ

            if(coreShape.visible) {
                coreShape.rotation.x += delta * 0.5; coreShape.rotation.y += delta * 0.8;
                let s = 1.0 + audioLevel * 0.5; coreShape.scale.set(s, s, s);
            }
            
            shaderUniforms.uTime.value = time;
            shaderUniforms.uState.value += (targetState - shaderUniforms.uState.value) * delta * 2.0;
            voxelMesh.rotation.y = Math.sin(time*0.3)*0.1;
            
            composer.render();
        }

        // Boot
        render();
        initAdaptiveWebLLM();
        bakeTextToVoxels("สถาปัตยกรรม Voxel OS พร้อมรับโสตายตนะ");
    </script>
</body>
</html>
