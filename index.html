<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel OS: Pure Architecture</title>
    <style>
        :root {
            --bg-color: #010203;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(0, 243, 255, 0.02));
            --glass-border: 1px solid rgba(0, 243, 255, 0.2);
            --cyan-core: #00f3ff; --gold-core: #f39c12; --magenta-core: #ff00ff; --green-core: #00ff66;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: white; user-select: none; touch-action: none; }
        
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        #shadow-dom { position: absolute; top: -9999px; left: -9999px; width: 320px; font-size: 24px; font-weight: bold; line-height: 1.5; word-wrap: break-word; visibility: hidden; }

        /* UI LAYER */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; pointer-events: auto; }
        .glass-pill { background: rgba(0,0,0,0.4); border: var(--glass-border); padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.6); font-weight: bold; }
        
        .hud-panel {
            background: var(--glass-bg); border: var(--glass-border); border-top: 1px solid rgba(255,255,255,0.2); border-radius: 24px;
            padding: 20px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); pointer-events: auto;
            max-width: 420px; margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 12px; position: relative;
        }
        .header { display: flex; justify-content: space-between; align-items: center; color: var(--gold-core); font-weight: bold; text-shadow: 0 0 10px var(--gold-core); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        .model-identity { font-family: 'Courier New', monospace; font-size: 0.7rem; color: #aaa; text-align: center; padding: 6px; border: 1px dashed rgba(255,255,255,0.2); border-radius: 12px; }

        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: white; padding: 10px 5px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; cursor: pointer; transition: all 0.3s; text-align: center; }
        .btn-glass:hover { background: rgba(0, 243, 255, 0.15); border-color: var(--cyan-core); box-shadow: 0 0 15px rgba(0,243,255,0.3); }
        .btn-glass.active { background: rgba(243, 156, 18, 0.2); border-color: var(--gold-core); color: var(--gold-core); text-shadow: 0 0 10px var(--gold-core); }

        .voice-btn { background: rgba(255, 0, 255, 0.1); border-color: var(--magenta-core); color: var(--magenta-core); grid-column: span 3; font-size: 0.8rem; padding: 12px;}
        .voice-btn.listening { background: var(--magenta-core); color: white; box-shadow: 0 0 20px var(--magenta-core); animation: pulse 1s infinite; }
        
        .p2p-btn { background: rgba(0, 255, 102, 0.1); border-color: var(--green-core); color: var(--green-core); grid-column: span 3; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .log-box { font-family: 'Courier New', monospace; font-size: 0.65rem; color: #ddd; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; height: 60px; overflow-y: auto; border-left: 2px solid var(--magenta-core); }
        .log-sys { color: var(--gold-core); } .log-ai { color: var(--cyan-core); } .log-p2p { color: var(--green-core); font-weight: bold;}

        /* SIGNALING MODAL */
        #p2p-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 20; backdrop-filter: blur(5px); flex-direction: column; justify-content: center; align-items: center; padding: 20px; pointer-events: auto;}
        .p2p-panel { background: var(--glass-bg); border: 1px solid var(--green-core); padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 30px rgba(0,255,102,0.2); }
        .p2p-panel h3 { color: var(--green-core); font-size: 0.9rem; text-align: center; }
        textarea { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 10px; font-size: 0.6rem; height: 60px; resize: none; font-family: monospace;}
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div id="shadow-dom"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="glass-pill" style="color:var(--cyan-core);">Voxel OS : Pure Architecture</div>
            <div class="glass-pill" id="telemetry">FPS: --</div>
        </div>

        <div class="hud-panel">
            <div class="header">🪷 MYCORRHIZAL MATRIX</div>
            <div class="model-identity" id="hud-model-name">🧠 CORE: Initialize...</div>
            
            <div class="btn-grid">
                <button class="btn-glass active" id="btn-zen" onclick="switchState('ZEN')">🧘‍♂️ สภาวะฌาน</button>
                <button class="btn-glass" id="btn-mag" onclick="switchState('MAGAZINE')">📖 โฮโลแกรม PDF</button>
                <button class="btn-glass" id="btn-music" onclick="playTone(440, 0, 0.5)">🎶 นาทพรหม</button>
                <button class="btn-glass voice-btn" id="btn-mic" onclick="toggleListening()">🎙️ ส่งกระแสจิต (เสียง)</button>
                <button class="btn-glass p2p-btn" onclick="openP2P()">🍄 เชื่อมโยงไมคอร์ไรซา (P2P)</button>
            </div>

            <div class="log-box" id="sys-log"></div>
        </div>
    </div>

    <!-- P2P SIGNALING UI -->
    <div id="p2p-modal">
        <div class="p2p-panel">
            <h3>สานเส้นใยไมคอร์ไรซา (WebRTC)</h3>
            <label style="font-size:0.7rem; color:#aaa;">1. สปอร์ของเรา (ก๊อปปี้ส่งให้เพื่อน)</label>
            <textarea id="myOffer" readonly placeholder="กดปุ่มสร้างสปอร์..."></textarea>
            <div style="display:flex; gap:5px;">
                <button class="btn-glass" style="flex:1; border-color:var(--green-core);" onclick="createOffer()">สร้างสปอร์ (Host)</button>
                <button class="btn-glass" style="flex:1;" onclick="copyMyOffer()">คัดลอก</button>
            </div>
            
            <label style="font-size:0.7rem; color:#aaa; margin-top:10px;">2. สปอร์ของสหาย (นำรหัสเพื่อนมาวาง)</label>
            <textarea id="friendOffer" placeholder="วางสปอร์ของสหายที่นี่..."></textarea>
            <div style="display:flex; gap:5px;">
                <button class="btn-glass" style="flex:1; border-color:var(--gold-core);" onclick="acceptOffer()">รับสปอร์ (Join)</button>
                <button class="btn-glass" style="flex:1; border-color:var(--cyan-core);" onclick="finalizeConnection()">ประสานจิต (Finalize)</button>
            </div>
            <button class="btn-glass" style="margin-top:10px; color:var(--alert-core);" onclick="document.getElementById('p2p-modal').style.display='none'">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        // ==========================================
        // 💎 SYSTEM_CONFIG (รัฐธรรมนูญแห่งสถาปัตยกรรม)
        // ถอนรากถอนโคน Magic Numbers มารวมไว้ที่นี่
        // ==========================================
        const SYSTEM_CONFIG = {
            SCENE: {
                cameraZ: 11.0,
                cameraY: -1.0,
                elevation: 2.5,        // ระดับความสูงของศูนย์กลางโฮโลแกรม (หนี HUD)
                bloomStrength: 2.0,
                bloomRadius: 0.5,
                bloomThreshold: 0.1
            },
            CORE: {
                radius: 1.5,
                tube: 0.4,
                tubularSegments: 100,
                radialSegments: 16,
                rotationSpeedX: 0.5,
                rotationSpeedY: 0.8
            },
            VOXEL: {
                maxCount: 4000,
                size: 0.06,
                spreadArea: 12.0,      // ระยะกระจายตัวตอนสุ่ม
                morphSpeed: 3.0,       // ความเร็วในการวิ่งชนเป้าหมาย
                idleFloatSpeed: 1.5    // ความเร็วลอยตัวตอนสภาวะฌาน
            },
            TYPOGRAPHY: {
                scale: 0.045,          // ขนาดสเกลแปลงจาก 2D ไป 3D
                elevationOffset: 3.5,  // ระดับความสูงของหน้ากระดาษ
                densityPerChar: 5,     // จำนวน Voxel ต่อ 1 ตัวอักษร
                jitter: 0.05,          // ความกระจัดกระจายของอนุภาคในตัวอักษร
                depth: 0.1             // ความหนาแกน Z ของตัวหนังสือ
            },
            P2P: {
                orbitRadius: 4.0,      // รัศมีวงโคจรของดาวสหาย
                orbitBounce: 1.5,      // ความสูงเด้งขึ้นลงของดาวสหาย
                orbitSpeed: 0.5
            },
            AUDIO: {
                synthRampUp: 0.05,
                synthVolume: 0.2
            },
            AI: {
                adaptiveModels: [
                    "Phi-3-mini-4k-instruct-q4f16_1-MLC",
                    "Llama-3.2-1B-Instruct-q4f32_1-MLC"
                ]
            }
        };

        // --- GLOBAL & LOGGING ---
        const SYS = { state: 'ZEN', logs: [], aiEngine: null, isFallback: true };
        function logMsg(msg, type = 'sys') {
            const t = new Date().toLocaleTimeString();
            SYS.logs.push({ t, msg, type }); if(SYS.logs.length > 6) SYS.logs.shift();
            const logEl = document.getElementById('sys-log');
            logEl.innerHTML = SYS.logs.map(l => `<div class="log-${l.type}">[${l.t}] ${l.msg}</div>`).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        // --- 🍄 WEBRTC P2P MYCORRHIZAL NETWORK ---
        let peerConnection; let dataChannel;
        const p2pConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        window.isP2PConnected = false;

        function initP2P() {
            peerConnection = new RTCPeerConnection(p2pConfig);
            peerConnection.onicecandidate = e => {
                if(e.candidate) return; 
                document.getElementById('myOffer').value = btoa(JSON.stringify(peerConnection.localDescription));
            };
            peerConnection.ondatachannel = e => { dataChannel = e.channel; setupChannel(); };
        }

        function setupChannel() {
            dataChannel.onopen = () => {
                logMsg("ประสานเส้นใยสำเร็จ!", "p2p"); window.isP2PConnected = true;
                document.getElementById('p2p-modal').style.display = 'none'; SYS.speakTTS("ประสานเส้นใยสำเร็จ");
                if(peerNode) peerNode.visible = true; if(peerLink) peerLink.visible = true;
            };
            dataChannel.onmessage = e => {
                const data = JSON.parse(e.data);
                if(data.type === 'THOUGHT') {
                    logMsg(`สหาย: "${data.msg}"`, "p2p"); bakeTextToVoxels(data.msg); SYS.speakTTS("กระแสจิตจากสหาย: " + data.msg);
                    switchState('MAGAZINE');
                    if(peerMat) { peerMat.emissiveIntensity = 3.0; setTimeout(()=>peerMat.emissiveIntensity=0.5, 500); }
                }
            };
        }

        window.openP2P = () => { document.getElementById('p2p-modal').style.display = 'flex'; initP2P(); };
        window.copyMyOffer = () => { navigator.clipboard.writeText(document.getElementById('myOffer').value); logMsg("คัดลอกสปอร์แล้ว", "sys"); };
        
        window.createOffer = async () => {
            dataChannel = peerConnection.createDataChannel("Mycorrhiza"); setupChannel();
            const offer = await peerConnection.createOffer(); await peerConnection.setLocalDescription(offer);
            logMsg("กำลังสร้างสปอร์...", "sys");
        };

        window.acceptOffer = async () => {
            const offer = JSON.parse(atob(document.getElementById('friendOffer').value));
            await peerConnection.setRemoteDescription(offer);
            const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer);
            logMsg("รับสปอร์แล้ว รอคัดลอก Answer", "sys");
        };

        window.finalizeConnection = async () => {
            const answer = JSON.parse(atob(document.getElementById('friendOffer').value));
            await peerConnection.setRemoteDescription(answer);
            logMsg("กำลังประสานจิต...", "sys");
        };

        function sendTelepathy(msg) {
            if(window.isP2PConnected && dataChannel.readyState === 'open') dataChannel.send(JSON.stringify({ type: 'THOUGHT', msg: msg }));
        }

        // --- 👁️ อายตนะ: AUDIO & SPEECH ---
        let audioCtx;
        window.playTone = (freq, time, duration) => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, audioCtx.currentTime + time);
            gain.gain.linearRampToValueAtTime(SYSTEM_CONFIG.AUDIO.synthVolume, audioCtx.currentTime + time + SYSTEM_CONFIG.AUDIO.synthRampUp);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + time + duration);
            osc.start(audioCtx.currentTime + time); osc.stop(audioCtx.currentTime + time + duration);
        };

        SYS.speakTTS = (text) => {
            if(!('speechSynthesis' in window)) return; window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'th-TH'; utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if(SpeechRecognition) {
            recognition = new SpeechRecognition(); recognition.lang = 'th-TH';
            recognition.onstart = () => { document.getElementById('btn-mic').classList.add('listening'); document.getElementById('btn-mic').innerText = "กำลังรับฟัง..."; };
            recognition.onend = () => { document.getElementById('btn-mic').classList.remove('listening'); document.getElementById('btn-mic').innerText = "🎙️ ส่งกระแสจิต (เสียง)"; };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript; logMsg(`> พูด: "${text}"`, "sys");
                sendTelepathy(text);
                if(SYS.aiEngine) {
                    SYS.aiEngine.chat.completions.create({ messages: [{ role: "user", content: `ตอบสั้นๆ: ${text}` }] })
                    .then(reply => {
                        const ans = reply.choices[0].message.content; logMsg(`AI: ${ans}`, "ai"); SYS.speakTTS(ans);
                        switchState('MAGAZINE'); bakeTextToVoxels(ans); sendTelepathy("AI ของสหายตอบว่า: " + ans);
                    });
                } else { switchState('MAGAZINE'); bakeTextToVoxels(text); }
            };
        }

        window.toggleListening = () => { if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); if(recognition) recognition.start(); };

        // --- 🧠 ADAPTIVE AI ---
        async function initWebLLM() {
            // ใช้ค่าจาก Config
            const defaultModel = SYSTEM_CONFIG.AI.adaptiveModels[0];
            try {
                SYS.aiEngine = await webllm.CreateMLCEngine(defaultModel, {
                    initProgressCallback: (r) => { document.getElementById('hud-model-name').innerText = `[${Math.round(r.progress*100)}%] Loading AI...`; }
                });
                document.getElementById('hud-model-name').innerText = `🧠 CORE: Adaptive Mode`; document.getElementById('hud-model-name').style.color = "var(--cyan-core)";
                SYS.speakTTS("ระบบตื่นรู้ พร้อมรับโสตายตนะ");
            } catch (e) { document.getElementById('hud-model-name').innerText = `🧠 CORE: Fallback`; }
        }

        // --- 🌌 THREE.JS & SHADER ---
        const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x010203, 0.05);
        
        // 💎 ใช้ค่าจาก CONFIG
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100); 
        camera.position.set(SYSTEM_CONFIG.SCENE.camPos.x, SYSTEM_CONFIG.SCENE.camPos.y, SYSTEM_CONFIG.SCENE.cameraZ); 
        camera.lookAt(0, SYSTEM_CONFIG.SCENE.elevation, 0); 

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(window.devicePixelRatio);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), SYSTEM_CONFIG.SCENE.bloomStrength, SYSTEM_CONFIG.SCENE.bloomRadius, SYSTEM_CONFIG.SCENE.bloomThreshold));

        // 💎 แกนหลัก (ใช้ CONFIG)
        const coreShape = new THREE.Mesh(
            new THREE.TorusKnotGeometry(SYSTEM_CONFIG.CORE.radius, SYSTEM_CONFIG.CORE.tube, SYSTEM_CONFIG.CORE.tubularSegments, SYSTEM_CONFIG.CORE.radialSegments), 
            new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.5 })
        );
        coreShape.position.y = SYSTEM_CONFIG.SCENE.elevation; 
        scene.add(coreShape);

        // 🍄 ดวงดาวสหาย
        let peerMat = new THREE.MeshStandardMaterial({ color: 0x00ff66, emissive: 0x00ff66, emissiveIntensity: 0.5, wireframe: true });
        let peerNode = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), peerMat);
        peerNode.visible = false; scene.add(peerNode);
        
        let linkGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
        let peerLink = new THREE.Line(linkGeo, new THREE.LineBasicMaterial({ color: 0x00ff66, transparent: true, opacity: 0.5 }));
        peerLink.visible = false; scene.add(peerLink);

        // Voxel Typography Shader
        const textMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 1.5 });
        const shaderUniforms = { uTime: { value: 0 }, uMorph: { value: 0.0 } };
        
        textMat.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = shaderUniforms.uTime; shader.uniforms.uMorph = shaderUniforms.uMorph;
            shader.vertexShader = `uniform float uTime; uniform float uMorph; attribute vec3 aTargetPos; attribute vec3 aRandomPos;` + shader.vertexShader;
            shader.vertexShader = shader.vertexShader.replace(`#include <begin_vertex>`, `
                vec3 idlePos = aRandomPos + vec3(sin(uTime*1.5+aRandomPos.x), cos(uTime*1.2+aRandomPos.y), sin(uTime+aRandomPos.z)) * 0.5;
                float zWave = sin(aTargetPos.x * 2.0 - uTime * 3.0) * 0.2;
                vec3 textPos = vec3(aTargetPos.x, aTargetPos.y, aTargetPos.z + zWave);
                vec3 transformed = mix(idlePos, textPos, uMorph);
            `);
        };

        // 💎 ใช้ CONFIG ควบคุม Voxel
        const voxelMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(SYSTEM_CONFIG.VOXEL.size, SYSTEM_CONFIG.VOXEL.size, SYSTEM_CONFIG.VOXEL.size), textMat, SYSTEM_CONFIG.VOXEL.maxCount);
        const targetPosArray = new Float32Array(SYSTEM_CONFIG.VOXEL.maxCount * 3); 
        const randomPosArray = new Float32Array(SYSTEM_CONFIG.VOXEL.maxCount * 3);
        
        for(let i=0; i<SYSTEM_CONFIG.VOXEL.maxCount; i++) {
            randomPosArray[i*3] = (Math.random()-0.5) * SYSTEM_CONFIG.VOXEL.spreadArea; 
            randomPosArray[i*3+1] = (Math.random()-0.5) * SYSTEM_CONFIG.VOXEL.spreadArea + SYSTEM_CONFIG.SCENE.elevation; 
            randomPosArray[i*3+2] = (Math.random()-0.5) * SYSTEM_CONFIG.VOXEL.spreadArea;
        }
        voxelMesh.geometry.setAttribute('aTargetPos', new THREE.InstancedBufferAttribute(targetPosArray, 3));
        voxelMesh.geometry.setAttribute('aRandomPos', new THREE.InstancedBufferAttribute(randomPosArray, 3));
        voxelMesh.visible = false; scene.add(voxelMesh); scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // --- SHADOW DOM LAYOUT ---
        window.bakeTextToVoxels = (text) => {
            const sd = document.getElementById('shadow-dom'); sd.innerHTML = ''; 
            for(let char of text) sd.innerHTML += (char === ' ') ? '<span>&nbsp;</span>' : `<span>${char}</span>`;
            setTimeout(() => {
                const spans = sd.querySelectorAll('span'); const sdRect = sd.getBoundingClientRect(); let voxelIdx = 0;
                spans.forEach((span) => {
                    if(span.innerText.trim() === '' || voxelIdx >= SYSTEM_CONFIG.VOXEL.maxCount) return;
                    const r = span.getBoundingClientRect(); 
                    
                    // 💎 ใช้ CONFIG สำหรับ Layout Typography
                    const x3d = (r.left - sdRect.left - (sdRect.width/2)) * SYSTEM_CONFIG.TYPOGRAPHY.scale; 
                    const y3d = -(r.top - sdRect.top - (sdRect.height/2)) * SYSTEM_CONFIG.TYPOGRAPHY.scale + SYSTEM_CONFIG.TYPOGRAPHY.elevationOffset; 
                    
                    for(let v=0; v<SYSTEM_CONFIG.TYPOGRAPHY.densityPerChar; v++) {
                        if(voxelIdx >= SYSTEM_CONFIG.VOXEL.maxCount) break;
                        targetPosArray[voxelIdx*3] = x3d + (Math.random()-0.5)*SYSTEM_CONFIG.TYPOGRAPHY.jitter;
                        targetPosArray[voxelIdx*3+1] = y3d + (Math.random()-0.5)*SYSTEM_CONFIG.TYPOGRAPHY.jitter;
                        targetPosArray[voxelIdx*3+2] = (Math.random()-0.5)*SYSTEM_CONFIG.TYPOGRAPHY.depth;
                        voxelIdx++;
                    }
                });
                voxelMesh.geometry.attributes.aTargetPos.needsUpdate = true; voxelMesh.count = voxelIdx; 
            }, 30);
        };

        window.switchState = (state) => {
            SYS.state = state;
            document.querySelectorAll('.btn-grid .btn-glass').forEach(b => b.classList.remove('active'));
            document.getElementById(state === 'ZEN' ? 'btn-zen' : 'btn-mag').classList.add('active');
            
            if(state === 'ZEN') { coreShape.visible = true; } 
            else if (state === 'MAGAZINE') { voxelMesh.visible = true; coreShape.visible = false; }
        };

        const clock = new THREE.Clock();
        function render() {
            requestAnimationFrame(render);
            const dt = clock.getDelta(); const t = clock.getElapsedTime();

            // 💎 ใช้ CONFIG ควบคุมความเร็ว
            if(coreShape.visible) { 
                coreShape.rotation.x += dt * SYSTEM_CONFIG.CORE.rotationSpeedX; 
                coreShape.rotation.y += dt * SYSTEM_CONFIG.CORE.rotationSpeedY; 
            }
            
            if(peerNode.visible) {
                const p2pConf = SYSTEM_CONFIG.P2P;
                peerNode.position.x = Math.sin(t * p2pConf.orbitSpeed) * p2pConf.orbitRadius;
                peerNode.position.z = Math.cos(t * p2pConf.orbitSpeed) * p2pConf.orbitRadius;
                peerNode.position.y = SYSTEM_CONFIG.SCENE.elevation + Math.sin(t * 0.8) * p2pConf.orbitBounce;
                peerNode.rotation.y += dt;
                
                const positions = peerLink.geometry.attributes.position.array;
                positions[0] = coreShape.position.x; positions[1] = coreShape.position.y; positions[2] = coreShape.position.z;
                positions[3] = peerNode.position.x; positions[4] = peerNode.position.y; positions[5] = peerNode.position.z;
                peerLink.geometry.attributes.position.needsUpdate = true;
            }

            if(voxelMesh.visible) {
                shaderUniforms.uTime.value = t;
                shaderUniforms.uMorph.value += ((SYS.state === 'MAGAZINE' ? 1.0 : 0.0) - shaderUniforms.uMorph.value) * dt * SYSTEM_CONFIG.VOXEL.morphSpeed;
                voxelMesh.rotation.y = Math.sin(t * 0.5) * 0.1;
                if(SYS.state === 'ZEN' && shaderUniforms.uMorph.value < 0.05) voxelMesh.visible = false;
            }
            composer.render();
        }

        logMsg("ถอนรากถอนโคน Magic Numbers เรียบร้อย", "sys");
        render();
        initWebLLM();
        bakeTextToVoxels("สถาปัตยกรรมบริสุทธิ์ ไร้มะเร็งร้าย");
    </script>
</body>
</html>
