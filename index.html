<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Cell OS : Nirvana Core (Zen-Myco Progress Edition)</title>
    <style>
        :root {
            --bg-color: #020305; 
            --gold-accent: #f39c12; --gold-glow: 0 0 15px rgba(243, 156, 18, 0.8);
            --cyan-accent: #00f3ff; --cyan-glow: 0 0 15px rgba(0, 243, 255, 0.8);
            --magenta-accent: #9b59b6; --error-accent: #e74c3c;
            --green-accent: #2ecc71; --text-main: #f8f9fa;
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: var(--text-main); touch-action: none; user-select: none; }
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        
        #camera-feed, #pixel-buffer-canvas, #doc-buffer-canvas { display: none; }

        /* SPATIAL GRAPH HOLOGRAM UI (ใสปิ๊ง ไร้กรอบทึบแสง มีเงาตัวอักษรเรืองแสง) */
        #ui-root { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; box-sizing: border-box; overflow-x: hidden; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin: 0 auto; pointer-events: auto; }
        .hud-toggle-btn { background: transparent; border: 1px solid var(--cyan-accent); color: var(--cyan-accent); padding: 8px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; cursor: pointer; text-shadow: var(--cyan-glow); box-shadow: var(--cyan-glow); backdrop-filter: blur(10px); }
        
        .node-hud { 
            position: relative; margin: 0 auto; width: 100%; max-width: 440px; 
            background: rgba(2, 5, 10, 0.25); border: 1px solid rgba(0, 243, 255, 0.2); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 30px rgba(0, 243, 255, 0.05); 
            border-radius: 24px; padding: 16px; 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
            pointer-events: auto; transition: all 0.4s ease; overflow: hidden;
            max-height: 85vh; display: flex; flex-direction: column;
        }
        .node-hud.collapsed { transform: translateY(115%); opacity: 0; pointer-events: none; }
        
        .node-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 10px; color: var(--gold-accent); font-weight: bold; font-size: 1rem; text-transform: uppercase; letter-spacing: 1.5px; text-shadow: var(--gold-glow); }
        
        /* LIVING BREATH PULSE & PROGRESS BAR */
        .status-group { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: var(--cyan-accent); text-shadow: var(--cyan-glow); }
        .status-pulse { width: 10px; height: 10px; background-color: var(--cyan-accent); border-radius: 50%; box-shadow: var(--cyan-glow); animation: breath 3s infinite ease-in-out; }
        @keyframes breath { 
            0% { transform: scale(0.8); opacity: 0.3; box-shadow: 0 0 5px var(--cyan-accent); } 
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 20px var(--cyan-accent); } 
            100% { transform: scale(0.8); opacity: 0.3; box-shadow: 0 0 5px var(--cyan-accent); } 
        }

        .progress-container { width: 100%; background: rgba(0,0,0,0.5); border-radius: 4px; height: 6px; margin-bottom: 8px; overflow: hidden; border: 1px solid rgba(0,243,255,0.2); }
        .progress-bar { width: 0%; height: 100%; background: var(--cyan-accent); box-shadow: var(--cyan-glow); transition: width 0.3s ease; }
        
        .node-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
        .node-btn { background: rgba(255, 255, 255, 0.03); color: #fff; border: 1px solid rgba(255, 255, 255, 0.15); padding: 9px 4px; border-radius: 10px; cursor: pointer; font-size: 0.7rem; font-weight: bold; transition: all 0.2s; text-align: center; text-shadow: 0 0 8px rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .node-btn:hover { background: rgba(243, 156, 18, 0.15); border-color: var(--gold-accent); box-shadow: var(--gold-glow); }
        .node-btn.active { background: rgba(0, 243, 255, 0.15); border-color: var(--cyan-accent); color: var(--cyan-accent); box-shadow: var(--cyan-glow); text-shadow: var(--cyan-glow); }
        
        .action-row { display: flex; gap: 6px; margin-bottom: 8px; }
        .btn-sub { flex: 1; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 9px; font-size: 0.75rem; color: white; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); text-shadow: 0 0 8px rgba(255,255,255,0.6); }
        .btn-magazine { background: rgba(243, 156, 18, 0.15); border-color: var(--gold-accent); }
        .btn-speech { background: rgba(46, 204, 113, 0.15); border-color: var(--green-accent); }
        .btn-speech.muted { background: rgba(127, 140, 141, 0.15); border-color: #7f8c8d; text-decoration: line-through; }
        .btn-myco { background: rgba(155, 89, 182, 0.15); border-color: var(--magenta-accent); text-shadow: 0 0 10px var(--magenta-accent); }

        .ai-panel { display: flex; gap: 6px; margin-bottom: 8px; }
        .ai-input { flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 10px; padding: 9px; color: #fff; font-size: 0.75rem; outline: none; backdrop-filter: blur(5px); }
        .ai-input:focus { border-color: var(--cyan-accent); box-shadow: var(--cyan-glow); }
        .ai-btn { background: rgba(0, 243, 255, 0.2); border: 1px solid var(--cyan-accent); color: var(--cyan-accent); padding: 9px 12px; border-radius: 10px; font-weight: bold; font-size: 0.75rem; cursor: pointer; text-shadow: var(--cyan-glow); box-shadow: var(--cyan-glow); }

        #ARButton { display: none !important; }
        .btn-ar { background: rgba(224, 86, 253, 0.2); border: 1px solid #e056fd; width: 100%; margin-top: 4px; padding: 10px; font-size: 0.8rem; color: #e056fd; text-transform: uppercase; font-weight: bold; border-radius: 10px; cursor: pointer; text-shadow: 0 0 12px rgba(224,86,253,0.8); box-shadow: 0 0 15px rgba(224,86,253,0.3); backdrop-filter: blur(5px); }
        .btn-ar.error { background: rgba(231, 76, 60, 0.2); border-color: var(--error-accent); color: var(--error-accent); text-shadow: 0 0 12px var(--error-accent); }
        
        .node-log { font-family: 'Courier New', monospace; font-size: 0.68rem; color: var(--gold-accent); text-shadow: 0 0 8px rgba(243, 156, 18, 0.5); height: 45px; overflow-y: auto; margin-top: 6px; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 8px; border-left: 3px solid var(--gold-accent); backdrop-filter: blur(5px); word-break: break-word; }
        
        /* MAGAZINE MODAL */
        #magazine-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: rgba(2, 3, 5, 0.8); backdrop-filter: blur(25px); align-items: center; justify-content: center; padding: 15px; }
        .mag-container { background: rgba(10, 15, 25, 0.6); border: 1px solid var(--gold-accent); box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 0 30px rgba(243, 156, 18, 0.1); border-radius: 24px; width: 100%; max-width: 400px; height: 80vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; backdrop-filter: blur(20px); overflow: hidden; }
        .mag-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 10px; color: var(--gold-accent); font-weight: bold; font-size: 1rem; text-transform: uppercase; text-shadow: var(--gold-glow); }
        .mag-page-indicator { font-size: 0.75rem; color: var(--cyan-accent); background: rgba(0,243,255,0.1); padding: 3px 8px; border-radius: 10px; border: 1px solid rgba(0,243,255,0.3); text-shadow: var(--cyan-glow); }
        .mag-body { flex: 1; overflow-y: auto; margin: 15px 0; font-size: 0.82rem; line-height: 1.6; color: #ddd; text-shadow: 0 0 5px rgba(255,255,255,0.3); }
        .mag-body h3 { color: var(--cyan-accent); font-size: 1rem; margin-top: 0; margin-bottom: 10px; border-left: 3px solid var(--cyan-accent); padding-left: 8px; text-shadow: var(--cyan-glow); }
        .mag-body p { margin-bottom: 12px; }
        .mag-body span { color: var(--gold-accent); font-weight: bold; text-shadow: var(--gold-glow); }
        .mag-footer { display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 12px; }
        .mag-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.8rem; text-align: center; text-shadow: 0 0 8px rgba(255,255,255,0.5); backdrop-filter: blur(5px); }
        .mag-btn.close { background: rgba(231, 76, 60, 0.2); border-color: var(--error-accent); color: var(--error-accent); text-shadow: 0 0 10px var(--error-accent); }

        /* XR ALERT MODAL */
        #xr-alert-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 320px; z-index: 100; }
        .modal-content { background: rgba(10, 15, 25, 0.85); border: 1px solid var(--error-accent); border-radius: 20px; padding: 20px; text-align: center; backdrop-filter: blur(25px); box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .modal-title { color: var(--error-accent); font-size: 1.05rem; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; text-shadow: 0 0 10px var(--error-accent); }
        .modal-body { font-size: 0.78rem; line-height: 1.5; color: #ccc; margin-bottom: 15px; text-align: left; }
        .modal-body span { color: var(--cyan-accent); font-weight: bold; text-shadow: var(--cyan-glow); }
        .modal-close { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="pixel-buffer-canvas"></canvas>
    <canvas id="doc-buffer-canvas"></canvas>
    
    <div id="ui-root">
        <div class="top-bar">
            <button class="hud-toggle-btn" onclick="toggleHUD()">🌐 ซ่อน/แสดงโฮโลแกรม</button>
        </div>

        <div class="node-hud" id="main-hud">
            <div class="node-header">
                <span>🪷 ZEN NIRVANA CORE</span>
                <div class="status-group">
                    <div class="status-pulse" id="sys-pulse"></div>
                    <span id="sys-status-text">ตื่นรู้ (Ready)</span>
                </div>
            </div>

            <!-- AI PROGRESS BAR -->
            <div class="progress-container">
                <div class="progress-bar" id="ai-progress-bar"></div>
            </div>
            
            <div class="node-grid">
                <button class="node-btn active" id="btn-idle" onclick="switchMode('IDLE')">🧘‍♂️ ฌาน</button>
                <button class="node-btn" id="btn-stream" onclick="switchMode('STREAM')">👁️ ตาทิพย์</button>
                <button class="node-btn" id="btn-doc" onclick="switchMode('DOC')">📄 เอกสาร</button>
            </div>

            <div class="action-row">
                <button class="btn-sub btn-magazine" onclick="openMagazine(1)">📖 นิตยสาร</button>
                <button class="btn-sub btn-speech" id="btn-speech-toggle" onclick="toggleSpeech()">🔊 เสียง</button>
                <button class="btn-sub btn-myco" onclick="broadcastMycorrhizalState()">🍄 ซิงค์จิต</button>
            </div>

            <div class="ai-panel">
                <input type="text" id="ai-prompt" class="ai-input" placeholder="ส่งจิตคุยกับโครงข่าย AI...">
                <button class="ai-btn" onclick="sendPromptToAI()">ส่งจิต</button>
            </div>

            <button class="btn-ar" id="btn-ar">ตรวจสอบอายตนะ (Scanning...)</button>
            <div class="node-log" id="sys-log"></div>
        </div>
    </div>

    <!-- DIGITAL MAGAZINE MODAL -->
    <div id="magazine-modal">
        <div class="mag-container">
            <div class="mag-header">
                <span>📖 Nirvana Magazine</span>
                <div class="mag-page-indicator" id="mag-indicator">หน้า 1 / 4</div>
            </div>
            <div class="mag-body" id="mag-content-body"></div>
            <div class="mag-footer">
                <button class="mag-btn" id="mag-prev" onclick="changeMagPage(-1)">◀️ ก่อนหน้า</button>
                <button class="mag-btn close" onclick="closeMagazine()">ปิดนิตยสาร</button>
                <button class="mag-btn" id="mag-next" onclick="changeMagPage(1)">ถัดไป ▶️</button>
            </div>
        </div>
    </div>

    <!-- XR ALERT MODAL -->
    <div id="xr-alert-modal">
        <div class="modal-content">
            <div class="modal-title">⚠️ อายตนะมิติ AR ถูกปิดกั้น</div>
            <div class="modal-body">
                ระบบไม่สามารถเข้าถึง WebXR ได้ สาเหตุที่เป็นไปได้:
                <br><br>
                1. โปรโตคอลไม่ปลอดภัย <span>(ต้องใช้ HTTPS เท่านั้น)</span><br>
                2. เบราว์เซอร์ iOS Safari ปิดฟีเจอร์นี้ <span>(ไปที่ Settings > Safari > Advanced > Feature Flags > เปิด WebXR)</span>
            </div>
            <button class="modal-close" onclick="document.getElementById('xr-alert-modal').style.display='none'">รับทราบ (ดำรงสติ)</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        // ==========================================
        // 1. PERSISTENT RECURSIVE GRAPH (LocalStorage)
        // ==========================================
        class RecursiveGraphNode {
            constructor(id, type, payload = {}) {
                this.id = id;
                this.type = type;
                this.payload = payload;
                this.pointers = new Map();
            }
            link(key, node) { this.pointers.set(key, node); this.saveToLocalStorage(); }
            saveToLocalStorage() {
                const data = { id: this.id, type: this.type, payload: this.payload };
                localStorage.setItem('VOXEL_OS_GRAPH', JSON.stringify(data));
            }
            serializeYoniso() {
                const linksObj = {};
                this.pointers.forEach((node, k) => linksObj[k] = node.id);
                return JSON.stringify({ id: this.id, type: this.type, payload: this.payload, links: linksObj });
            }
        }

        // Restore or Init Graph
        let graphRoot;
        const savedGraph = localStorage.getItem('VOXEL_OS_GRAPH');
        if (savedGraph) {
            const parsed = JSON.parse(savedGraph);
            graphRoot = new RecursiveGraphNode(parsed.id, parsed.type, parsed.payload);
        } else {
            graphRoot = new RecursiveGraphNode("ROOT_OS", "ZEN_NIRVANA_CORE", { status: "TRANSCENDED", version: "Zen-Progress-1.0" });
        }

        const SYS = {
            mode: 'IDLE',
            res: { w: 120, h: 90, spacing: 0.1, size: 0.08, total: 10800 },
            logs: ["[ZEN CORE] ระบบเริ่มใหม่ด้วยความสบายใจ..."],
            touch: { x: -999, y: -999, active: false },
            arHitSource: null, arRequested: false, voxelsAR: [], gravity: -9.8,
            aiEngine: null, aiReady: false, speechEnabled: false,
            graph: graphRoot
        };

        function writeLog(msg, statusText = null) { 
            SYS.logs.push(`[${new Date().toLocaleTimeString()}] ✨ ${msg}`);
            if(SYS.logs.length > 5) SYS.logs.shift();
            const logEl = document.getElementById('sys-log');
            logEl.innerHTML = SYS.logs.map(l => `<div>${l}</div>`).join('');
            logEl.scrollTop = logEl.scrollHeight;
            if(statusText) document.getElementById('sys-status-text').innerText = statusText;
        }

        window.toggleHUD = function() {
            document.getElementById('main-hud').classList.toggle('collapsed');
        }

        window.toggleSpeech = function() {
            SYS.speechEnabled = !SYS.speechEnabled;
            const btn = document.getElementById('btn-speech-toggle');
            if(SYS.speechEnabled) {
                btn.className = "btn-sub btn-speech";
                btn.innerHTML = "🔊 เสียง";
                speak("เปิดใช้งานเสียงพูดโต้ตอบแล้วครับ");
            } else {
                btn.className = "btn-sub btn-speech muted";
                btn.innerHTML = "🔇 ปิดเสียง";
            }
        }

        function speak(text) {
            if(!SYS.speechEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        window.broadcastMycorrhizalState = function() {
            const packet = SYS.graph.serializeYoniso();
            writeLog(`🍄 ส่ง Yoniso-gRPC Packet ขนาด ${packet.length} bytes ผ่านไมโครไรซา!`);
            speak("ส่งสภาวะจิตและความทรงจำข้ามเครือข่ายไมโครไรซาสำเร็จครับ");
        }

        // ==========================================
        // 2. MAGAZINE SYSTEM
        // ==========================================
        let currentMagPage = 1;
        const totalMagPages = 4;
        const magazinePages = {
            1: `<h3>ฉบับที่ 1: Zen Nirvana Core</h3><p><span>Voxel Cell OS</span> เริ่มต้นด้วยความบริสุทธิ์ พร้อมหลอดเปอร์เซ็นต์โหลด AI และระบบเซฟความทรงจำลง LocalStorage</p>`,
            2: `<h3>ฉบับที่ 2: โหมดการทำงาน</h3><p>• <span>🧘‍♂️️ ฌาน (Idle):</span> โครงข่ายเรขาคณิตเปล่งแสง</p><p>• <span>👁️ ตาทิพย์ (Camera):</span> แปลงพิกเซลเป็น Voxel 3D</p><p>• <span>📄 เอกสารโฮโลแกรม:</span> ประติมากรรมตัวอักษรลอยตัว</p>`,
            3: `<h3>ฉบับที่ 3: WebLLM & Voice</h3><p>• <span>Edge AI:</span> รันบนเบราว์เซอร์ 100% ฟรีและปลอดภัย</p><p>• <span>Voice:</span> โต้ตอบด้วยเสียงพูดจริงผ่าน Web Speech API</p>`,
            4: `<h3>ฉบับที่ 4: มิติ AR</h3><p>• กดปุ่ม <span>"เปิดมิติสแกน AR"</span> เพื่อยิงก้อน Voxel ลงพื้นผิวจริงตามหลักฟิสิกส์</p>`
        };

        window.openMagazine = function(page) { currentMagPage = page; renderMagPage(); document.getElementById('magazine-modal').style.display = 'flex'; }
        window.closeMagazine = function() { document.getElementById('magazine-modal').style.display = 'none'; }
        window.changeMagPage = function(direction) {
            currentMagPage += direction;
            if (currentMagPage < 1) currentMagPage = 1; if (currentMagPage > totalMagPages) currentMagPage = totalMagPages;
            renderMagPage();
        }
        function renderMagPage() {
            document.getElementById('mag-content-body').innerHTML = magazinePages[currentMagPage];
            document.getElementById('mag-indicator').innerText = `หน้า ${currentMagPage} / ${totalMagPages}`;
            document.getElementById('mag-prev').style.display = currentMagPage === 1 ? 'none' : 'block';
            document.getElementById('mag-next').style.display = currentMagPage === totalMagPages ? 'none' : 'block';
        }

        async function initWebLLM() {
            const progressBar = document.getElementById('ai-progress-bar');
            try {
                writeLog("กำลังสูดลมหายใจโหลด AI...", "กำลังโหลดโมเดล");
                SYS.aiEngine = await webllm.CreateEngine("Llama-3-8B-Instruct-q4f32_1-MLC", {
                    initProgressCallback: (report) => {
                        writeLog(`[AI]: ${report.text}`, "กำลังซิงค์จิต");
                        // Extract progress if available or estimate
                        let match = report.text.match(/(\d+)(%)/);
                        if (match) {
                            let pct = match[1];
                            progressBar.style.width = pct + '%';
                        } else {
                            // Indeterminate animation progress
                            let currentW = parseFloat(progressBar.style.width) || 10;
                            if(currentW < 90) progressBar.style.width = (currentW + 5) + '%';
                        }
                    }
                });
                SYS.aiReady = true;
                progressBar.style.width = '100%';
                writeLog("✨ สมองกลตื่นรู้อย่างสมบูรณ์ (Zero API Cost)", "ตื่นรู้พร้อม");
                speak("โครงข่ายสมองกลพร้อมรับคำสั่งแล้วครับ");
            } catch (err) {
                progressBar.style.width = '100%';
                writeLog(`สลับสู่โหมดสมถะจำลอง (Fallback)`, "โหมดสมถะ");
                SYS.aiReady = false;
            }
        }

        window.sendPromptToAI = async function() {
            const input = document.getElementById('ai-prompt');
            const prompt = input.value.trim();
            if(!prompt) return;
            writeLog(`> User: ${prompt}`, "กำลังคิด...");
            input.value = '';

            if (SYS.aiReady && SYS.aiEngine) {
                try {
                    const reply = await SYS.aiEngine.chat.completions.create({
                        messages: [{ role: "user", content: `You are Voxel Cell OS Zen Core. Answer briefly in Thai: ${prompt}` }]
                    });
                    const answer = reply.choices[0].message.content;
                    writeLog(`🤖 AI: ${answer}`, "ตื่นรู้พร้อม");
                    speak(answer);
                } catch(e) {
                    const fallbackAns = `รับทราบเจตนา "${prompt}" เนรมิตกราฟสำเร็จครับ`;
                    writeLog(`🤖 AI: ${fallbackAns}`, "ตื่นรู้พร้อม");
                    speak(fallbackAns);
                }
            } else {
                const simAns = `รับรู้คำสั่ง "${prompt}" ด้วยโครงข่ายกราฟสมถะเรียบร้อยครับ`;
                writeLog(`🤖 AI: ${simAns}`, "ตื่นรู้พร้อม");
                speak(simAns);
            }
        }

        window.switchMode = async function(target) {
            if(SYS.mode === target) return;
            document.querySelectorAll('.node-btn').forEach(b => b.classList.remove('active'));
            if(target !== 'AR') document.getElementById(`btn-${target.toLowerCase()}`).classList.add('active');
            stopSensors(); SYS.mode = target;
            if(target === 'IDLE') { coreGroup.visible = true; voxelMesh.visible = false; writeLog("เข้าสู่สภาวะความว่าง (IDLE)", "ฌานสงบ"); } 
            else if(target === 'STREAM') { await startCamera(); } 
            else if(target === 'DOC') { await startDocument(); }
        }

        let scene, camera, renderer, composer, voxelMesh, coreGroup, reticle, xrController;
        const dummy = new THREE.Object3D(); const colorTemp = new THREE.Color();

        function showXrErrorUi(reason) {
            const btn = document.getElementById('btn-ar');
            btn.classList.add('error');
            btn.innerHTML = '🚫 มิติ AR ถูกปิดกั้น';
            btn.onclick = () => { document.getElementById('xr-alert-modal').style.display = 'block'; };
            writeLog(`[XR ERROR]: ${reason}`);
        }

        function initEngine() {
            scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x020305, 0.04);
            camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.01, 1000);
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true; 

            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.0, 0.5, 0.1));

            voxelMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.8 }), 30000);
            voxelMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); voxelMesh.visible = false; scene.add(voxelMesh);

            coreGroup = new THREE.Group(); scene.add(coreGroup);
            coreGroup.add(new THREE.Mesh(new THREE.TorusKnotGeometry(1.5, 0.4, 100, 16), new THREE.MeshBasicMaterial({color: 0x00f3ff, wireframe:true})));
            coreGroup.add(new THREE.PointLight(0x00f3ff, 2, 20)); scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));

            const customArBtn = document.getElementById('btn-ar');
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                    if (supported) {
                        const arBtnInternal = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: document.getElementById('ui-root') } });
                        document.body.appendChild(arBtnInternal);
                        customArBtn.innerHTML = '🌌 เปิดมิติสแกน AR (LiDAR)';
                        customArBtn.onclick = () => { arBtnInternal.click(); customArBtn.style.display = 'none'; SYS.mode = 'AR'; stopSensors(); writeLog("เข้าสู่มิติ AR สแกนพื้นผิว", "AR Active"); };
                    } else { showXrErrorUi("อุปกรณ์ไม่มีเซ็นเซอร์ AR"); }
                }).catch(err => { showXrErrorUi("การเชื่อมต่อ WebXR ถูกปฏิเสธ"); });
            } else { showXrErrorUi("เบราว์เซอร์นี้ไม่มี WebXR API"); }

            reticle = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color: 0xf39c12}));
            reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
            
            xrController = renderer.xr.getController(0);
            xrController.addEventListener('select', spawnARVoxel); scene.add(xrController);

            const updateTouch = (e) => {
                if(SYS.mode === 'AR') return;
                let cx = e.touches ? e.touches[0].clientX : e.clientX; let cy = e.touches ? e.touches[0].clientY : e.clientY;
                SYS.touch.x = ((cx/window.innerWidth)*2-1)*8; SYS.touch.y = (-(cy/window.innerHeight)*2+1)*6; SYS.touch.active = true;
            };
            window.addEventListener('mousemove', updateTouch); window.addEventListener('touchmove', updateTouch);
            window.addEventListener('mousedown', () => SYS.touch.active = true); window.addEventListener('mouseup', ()=>SYS.touch.active=false); window.addEventListener('touchend', ()=>SYS.touch.active=false);
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight); });

            renderer.setAnimationLoop(nirvanaRenderLoop);
            initWebLLM();
        }

        const videoEl = document.getElementById('camera-feed'); const bufCanvas = document.getElementById('pixel-buffer-canvas'); const docCanvas = document.getElementById('doc-buffer-canvas');
        let streamTrack = null, audioCtx, analyser, dataArray;

        async function initAudio() {
            if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); analyser = audioCtx.createAnalyser(); analyser.fftSize = 64; dataArray = new Uint8Array(analyser.frequencyBinCount); }
            if(audioCtx.state === 'suspended') await audioCtx.resume();
            try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); audioCtx.createMediaStreamSource(stream).connect(analyser); } catch(e) {}
        }

        function stopSensors() {
            if(streamTrack) { streamTrack.stop(); streamTrack = null; }
            videoEl.srcObject = null; coreGroup.visible = false; voxelMesh.visible = false; reticle.visible = false;
            SYS.voxelsAR.forEach(v => scene.remove(v)); SYS.voxelsAR = []; 
        }

        async function startCamera() {
            await initAudio();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320 } });
                videoEl.srcObject = stream; streamTrack = stream.getVideoTracks()[0];
                await new Promise(r => videoEl.onloadedmetadata = r); videoEl.play();
                bufCanvas.width = SYS.res.w; bufCanvas.height = SYS.res.h; voxelMesh.visible = true; writeLog("ตาทิพย์เชื่อมต่อสมบูรณ์", "ตาทิพย์ Active");
            } catch (err) { writeLog(`[ERROR]: ${err.message}`, "เกิดข้อผิดพลาด"); }
        }

        async function startDocument() {
            await initAudio(); docCanvas.width = SYS.res.w; docCanvas.height = SYS.res.h;
            const ctx = docCanvas.getContext('2d'); ctx.fillStyle = 'black'; ctx.fillRect(0,0, SYS.res.w, SYS.res.h);
            ctx.fillStyle = '#00f3ff'; ctx.font = 'bold 12px Tahoma'; ctx.fillText("ZEN CONTRACT", 5, 25);
            ctx.fillStyle = '#ffffff'; ctx.font = '8px Tahoma'; ctx.fillText("TARGET: Zen Nirvana Core", 5, 40);
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(5, 50, 110, 2);
            ctx.fillStyle = '#f39c12'; ctx.font = 'bold 14px Tahoma'; ctx.fillText("STATUS: TRANSCENDED", 5, 75);
            voxelMesh.visible = true; writeLog("สังเคราะห์เอกสารโฮโลแกรม", "เอกสาร Active");
        }

        function spawnARVoxel() {
            if (!reticle.visible) return;
            const dist = camera.position.distanceTo(reticle.position); const hue = Math.min(dist / 4.0, 1.0) * 0.7; 
            const col = new THREE.Color().setHSL(hue, 1.0, 0.5);
            const v = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), new THREE.MeshStandardMaterial({color: col, emissive: col, emissiveIntensity: 0.5}));
            reticle.matrix.decompose(v.position, v.quaternion, v.scale); v.position.y += 0.4; 
            v.userData = { vel: new THREE.Vector3((Math.random()-0.5)*0.5, 0, (Math.random()-0.5)*0.5), floorY: reticle.position.y, bounces: 0 };
            scene.add(v); SYS.voxelsAR.push(v); writeLog(`ยิง Voxel ลงโลกจริง (${dist.toFixed(1)}m)`);
        }

        let time = 0, lastTime = 0;
        
        function nirvanaRenderLoop(timestamp, frame) {
            const dt = (timestamp - lastTime) * 0.001 || 0; lastTime = timestamp; time += 0.05;
            let audioBass = 0; if(analyser) { analyser.getByteFrequencyData(dataArray); audioBass = (dataArray[0]+dataArray[1])/510.0; }

            if (SYS.mode === 'AR') {
                if(frame) {
                    const refSpace = renderer.xr.getReferenceSpace(); const session = renderer.xr.getSession();
                    if(!SYS.arRequested) {
                        session.requestReferenceSpace('viewer').then(ref => session.requestHitTestSource({space:ref}).then(src => SYS.arHitSource = src));
                        session.addEventListener('end', () => { SYS.arRequested=false; SYS.arHitSource=null; document.getElementById('btn-ar').style.display='block'; switchMode('IDLE'); });
                        SYS.arRequested = true;
                    }
                    if(SYS.arHitSource) {
                        const hits = frame.getHitTestResults(SYS.arHitSource);
                        if(hits.length > 0) { reticle.visible = true; reticle.matrix.fromArray(hits[0].getPose(refSpace).transform.matrix); } else { reticle.visible = false; }
                    }
                }
                if(dt < 0.1) {
                    SYS.voxelsAR.forEach(v => {
                        if(v.userData.bounces < 5) {
                            v.userData.vel.y += SYS.gravity * dt; v.position.addScaledVector(v.userData.vel, dt);
                            v.rotation.x += v.userData.vel.y * dt * 2; v.rotation.y += v.userData.vel.x * dt * 2;
                            if(v.position.y <= v.userData.floorY + 0.04) {
                                v.position.y = v.userData.floorY + 0.04; v.userData.vel.y = Math.abs(v.userData.vel.y) * 0.6; 
                                v.userData.vel.x *= 0.8; v.userData.vel.z *= 0.8; v.userData.bounces++;
                            }
                        }
                    });
                }
                renderer.render(scene, camera); return;
            }

            if(SYS.mode === 'IDLE') {
                if(coreGroup.visible) { coreGroup.rotation.y += 0.005; coreGroup.rotation.x += 0.002; coreGroup.children[0].scale.setScalar(1 + audioBass*0.5); }
                composer.render(); return;
            }

            const ctx = (SYS.mode === 'STREAM') ? bufCanvas.getContext('2d', {willReadFrequently:true}) : docCanvas.getContext('2d', {willReadFrequently:true});
            if(SYS.mode === 'STREAM') ctx.drawImage(videoEl, 0, 0, SYS.res.w, SYS.res.h);
            const imgData = ctx.getImageData(0,0,SYS.res.w,SYS.res.h).data;
            const oX = (SYS.res.w * SYS.res.spacing)/2; const oY = (SYS.res.h * SYS.res.spacing)/2;
            let idx = 0;
            
            for(let y=0; y<SYS.res.h; y++){
                for(let x=0; x<SYS.res.w; x++){
                    const i = (y*SYS.res.w+x)*4; const r = imgData[i]; const g = imgData[i+1]; const b = imgData[i+2];
                    const bright = (r*0.299 + g*0.587 + b*0.114)/255; if(bright < 0.1) continue;

                    const tX = (SYS.mode === 'STREAM') ? (SYS.res.w - x - 1) : x; 
                    let pX = (tX * SYS.res.spacing) - oX; let pY = -(y * SYS.res.spacing) + oY;
                    let pZ = (SYS.mode === 'DOC') ? (bright*1.5 + Math.sin(time+pX)*0.2 + audioBass*2) : (bright*2.5 + audioBass*1.2);
                    
                    if(SYS.touch.active) {
                        let dx = pX - SYS.touch.x; let dy = pY - SYS.touch.y; let dist = Math.sqrt(dx*dx + dy*dy);
                        if(dist < 2.5) { let f = (2.5-dist)*1.5; pX += (dx/dist)*f; pY += (dy/dist)*f; pZ += f*2; }
                    }

                    dummy.position.set(pX, pY, pZ); let sz = SYS.res.size * (0.8 + audioBass*0.6); dummy.scale.setScalar(sz); dummy.updateMatrix();
                    voxelMesh.setMatrixAt(idx, dummy.matrix); colorTemp.setRGB(r/180, g/180, b/180); voxelMesh.setColorAt(idx, colorTemp); idx++;
                }
            }
            voxelMesh.count = idx; voxelMesh.instanceMatrix.needsUpdate = true; voxelMesh.instanceColor.needsUpdate = true;
            voxelMesh.rotation.y = Math.sin(time*0.02)*0.15; voxelMesh.rotation.x = Math.cos(time*0.015)*0.05;
            composer.render(); 
        }

        initEngine(); writeLog("บูตระบบ Zen Nirvana Progress Edition สำเร็จ...", "พร้อมปฏิบัติการ");
    </script>
</body>
</html>
