<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Cell OS : Nirvana Core (Dream State Edition)</title>
    <style>
        :root {
            --bg-color: #020305; 
            --hud-bg: rgba(5, 10, 15, 0.75); 
            --hud-border: rgba(243, 156, 18, 0.4);
            --gold-accent: #f39c12; --gold-glow: rgba(243, 156, 18, 0.8);
            --cyan-accent: #00f3ff; --cyan-glow: rgba(0, 243, 255, 0.8);
            --magenta-accent: #9b59b6; --error-accent: #e74c3c;
            --green-accent: #2ecc71; --text-main: #f8f9fa;
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: var(--text-main); touch-action: none; user-select: none; }
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        
        #camera-feed, #pixel-buffer-canvas, #doc-buffer-canvas { display: none; }

        #ui-root { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px 10px; box-sizing: border-box; overflow-x: hidden; }
        
        .node-hud { 
            position: relative; margin: 0 auto; width: 100%; max-width: 440px; 
            background: var(--hud-bg); border: 1px solid var(--hud-border); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), inset 0 0 25px rgba(243, 156, 18, 0.1); 
            border-radius: 20px; padding: 14px; 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            pointer-events: auto; transition: all 0.4s ease; overflow: hidden;
        }
        
        .node-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 6px; margin-bottom: 8px; color: var(--gold-accent); font-weight: bold; font-size: 1.05rem; text-shadow: 0 0 12px var(--gold-glow); letter-spacing: 1px; text-transform: uppercase; }
        .status-dot { width: 10px; height: 10px; background-color: var(--gold-accent); border-radius: 50%; box-shadow: 0 0 15px var(--gold-accent); animation: pulse 2s infinite; }
        
        .node-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 6px; }
        .node-btn { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 9px 3px; border-radius: 8px; cursor: pointer; font-size: 0.68rem; font-weight: bold; transition: all 0.2s; backdrop-filter: blur(5px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .node-btn:hover { background: rgba(243, 156, 18, 0.2); border-color: var(--gold-accent); transform: translateY(-2px); box-shadow: 0 5px 15px var(--gold-glow); }
        .node-btn.active { background: rgba(0, 243, 255, 0.2); border-color: var(--cyan-accent); color: var(--cyan-accent); box-shadow: 0 0 15px var(--cyan-glow); }
        
        .ai-panel { display: flex; gap: 5px; margin-bottom: 6px; }
        .ai-input { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 8px; padding: 8px; color: #fff; font-size: 0.75rem; outline: none; }
        .ai-input:focus { border-color: var(--cyan-accent); box-shadow: 0 0 10px var(--cyan-glow); }
        .ai-btn { background: linear-gradient(135deg, #00f3ff, #0055ff); border: none; color: white; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }

        .btn-magazine { background: linear-gradient(135deg, #f39c12, #d35400); border: none; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4); width: 100%; margin-bottom: 5px; padding: 9px; font-size: 0.8rem; color: white; text-transform: uppercase; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .btn-dream { background: linear-gradient(135deg, #9b59b6, #8e44ad); border: none; box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4); width: 100%; margin-bottom: 6px; padding: 9px; font-size: 0.8rem; color: white; text-transform: uppercase; font-weight: bold; border-radius: 8px; cursor: pointer; }
        
        #ARButton { display: none !important; }
        .btn-ar { background: linear-gradient(135deg, #e056fd, #686de0); border: none; box-shadow: 0 4px 15px rgba(224, 86, 253, 0.4); width: 100%; margin-top: 4px; padding: 10px; font-size: 0.85rem; color: white; text-transform: uppercase; font-weight: bold; border-radius: 8px; cursor: pointer; pointer-events: auto; }
        .btn-ar.error { background: linear-gradient(135deg, #e74c3c, #c0392b); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
        
        .node-log { font-family: 'Courier New', monospace; font-size: 0.68rem; color: var(--gold-accent); height: 55px; overflow-y: auto; margin-top: 6px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px; border-left: 3px solid var(--gold-accent); word-break: break-word; }
        
        /* MAGAZINE MODAL STYLES */
        #magazine-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: rgba(2, 3, 5, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); align-items: center; justify-content: center; padding: 15px; }
        .mag-container { background: rgba(10, 15, 25, 0.95); border: 1px solid var(--gold-accent); box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(243, 156, 18, 0.15); border-radius: 24px; width: 100%; max-width: 420px; height: 82vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; overflow: hidden; position: relative; }
        .mag-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 10px; color: var(--gold-accent); font-weight: bold; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        .mag-page-indicator { font-size: 0.75rem; color: var(--cyan-accent); background: rgba(0,243,255,0.1); padding: 3px 8px; border-radius: 10px; border: 1px solid rgba(0,243,255,0.3); }
        .mag-body { flex: 1; overflow-y: auto; margin: 15px 0; font-size: 0.85rem; line-height: 1.6; color: #ddd; padding-right: 5px; }
        .mag-body h3 { color: var(--cyan-accent); font-size: 1rem; margin-top: 0; margin-bottom: 10px; border-left: 3px solid var(--cyan-accent); padding-left: 8px; }
        .mag-body p { margin-bottom: 12px; }
        .mag-body span { color: var(--gold-accent); font-weight: bold; }
        .mag-footer { display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 12px; }
        .mag-btn { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.8rem; text-align: center; }
        .mag-btn.close { background: linear-gradient(135deg, #e74c3c, #c0392b); border: none; }

        /* XR Alert Modal */
        #xr-alert-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 340px; z-index: 100; }
        .modal-content { background: rgba(10, 15, 25, 0.95); border: 1px solid var(--error-accent); box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(231, 76, 60, 0.15); border-radius: 20px; padding: 20px; text-align: center; backdrop-filter: blur(25px); }
        .modal-title { color: var(--error-accent); font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; }
        .modal-body { font-size: 0.8rem; line-height: 1.4; color: #ccc; margin-bottom: 15px; text-align: left; }
        .modal-body span { color: var(--cyan-accent); font-weight: bold; }
        .modal-close { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        
        @keyframes pulse { 0% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.5); } 100% { opacity: 0.4; transform: scale(1); } }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="pixel-buffer-canvas"></canvas>
    <canvas id="doc-buffer-canvas"></canvas>
    
    <div id="ui-root">
        <div class="node-hud">
            <div class="node-header">
                <span>🪷 NIRVANA x Gemini</span>
                <div class="status-dot" id="sys-status"></div>
            </div>
            <div class="node-grid">
                <button class="node-btn active" id="btn-idle" onclick="switchMode('IDLE')">🧘‍♂️ ฌาน</button>
                <button class="node-btn" id="btn-stream" onclick="switchMode('STREAM')">👁️ ตาทิพย์</button>
                <button class="node-btn" id="btn-doc" onclick="switchMode('DOC')">📄 เอกสาร</button>
            </div>
            <button class="btn-magazine" onclick="openMagazine(1)">📖 นิตยสาร OS (คู่มือระบบ)</button>
            <button class="btn-dream" onclick="triggerOvernightLearning()">🌙 ซิงค์ภวังค์ข้ามคืน (Gemini Bridge)</button>
            <div class="ai-panel">
                <input type="text" id="ai-prompt" class="ai-input" placeholder="สั่งการ AI (เช่น สร้างวิมาน)...">
                <button class="ai-btn" onclick="sendPromptToAI()">ส่งจิต</button>
            </div>
            <button class="btn-ar" id="btn-ar">ตรวจสอบอายตนะ (Scanning...)</button>
            <div class="node-log" id="sys-log"></div>
        </div>
    </div>

    <!-- DIGITAL MAGAZINE MODAL -->
    <div id="magazine-modal">
        <div class="mag-container">
            <div class="mag-header">
                <span>📖 Nirvana Magazine</span>
                <div class="mag-page-indicator" id="mag-indicator">หน้า 1 / 4</div>
            </div>
            <div class="mag-body" id="mag-content-body"></div>
            <div class="mag-footer">
                <button class="mag-btn" id="mag-prev" onclick="changeMagPage(-1)">◀️ ก่อนหน้า</button>
                <button class="mag-btn close" onclick="closeMagazine()">ปิดนิตยสาร</button>
                <button class="mag-btn" id="mag-next" onclick="changeMagPage(1)">ถัดไป ▶️</button>
            </div>
        </div>
    </div>

    <!-- XR ALERT MODAL -->
    <div id="xr-alert-modal">
        <div class="modal-content">
            <div class="modal-title">⚠️ อายตนะมิติ AR ถูกปิดกั้น</div>
            <div class="modal-body">
                ระบบไม่สามารถเข้าถึง WebXR ได้ สาเหตุที่เป็นไปได้:
                <br><br>
                1. โปรโตคอลไม่ปลอดภัย <span>(ต้องใช้ HTTPS เท่านั้น)</span><br>
                2. เบราว์เซอร์ iOS Safari ปิดฟีเจอร์นี้ <span>(ไปที่ Settings > Safari > Advanced > Feature Flags > เปิด WebXR)</span>
            </div>
            <button class="modal-close" onclick="document.getElementById('xr-alert-modal').style.display='none'">รับทราบ (ดำรงสติ)</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        // ==========================================
        // 1. MAGAZINE SYSTEM
        // ==========================================
        let currentMagPage = 1;
        const totalMagPages = 4;
        const magazinePages = {
            1: `
                <h3>ฉบับที่ 1: ปรัชญาและสถาปัตยกรรม</h3>
                <p>ยินดีต้อนรับสู่ <span>Voxel Cell OS : Nirvana Core</span> สถาปัตยกรรม Spatial Computing ที่ขับเคลื่อนด้วยโยนิโสมนสิการและตรรกะแห่งความว่าง (Sunyata)</p>
                <p>• <span>Zero Garbage Collection:</span> จองหน่วยความจำ InstancedMesh เพียงครั้งเดียว 30,000 ก้อน</p>
                <p>• <span>Zero API Cost:</span> รัน Edge AI บนเครื่องผู้ใช้โดยตรง</p>
            `,
            2: `
                <h3>ฉบับที่ 2: คู่มือการเข้าสู่มิติ (Modes)</h3>
                <p>ระบบประกอบด้วย 3 ฌานสมาบัติหลัก:</p>
                <p>• <span>🧘‍♂️ ฌาน (Idle):</span> สภาวะจิตสงบ แสดงผลโครงข่ายเรขาคณิต (Torus Knot) เปล่งแสงสีทอง</p>
                <p>• <span>👁️ ตาทิพย์ (Camera):</span> แปลงพิกเซลจากกล้องเป็น Voxel 3D พร้อม Audio-Reactive</p>
                <p>• <span>📄 เอกสารโฮโลแกรม:</span> แปลงข้อมูลใบเสนอราคาให้เป็นประติมากรรม 3D</p>
            `,
            3: `
                <h3>ฉบับที่ 3: สมองกล WebLLM & Gemini Bridge</h3>
                <p>ปัญญาญาณสองระดับของ OS:</p>
                <p>• <span>WebLLM:</span> สมองกลเฉพาะหน้า รันบนเบราว์เซอร์ 100% ฟรีและส่วนตัว</p>
                <p>• <span>Gemini Overnight Learning:</span> กดปุ่มซิงค์ภวังค์ข้ามคืนเพื่อให้ OS ส่งข้อมูลไปสังเคราะห์ความรู้ภายนอก ตื่นมาฉลาดขึ้นทันที</p>
            `,
            4: `
                <h3>ฉบับที่ 4: มิติ AR และคำแนะนำ</h3>
                <p>การเปิดใช้งาน LiDAR และ WebXR:</p>
                <p>• กดปุ่ม <span>"เปิดมิติสแกน AR"</span> เพื่อยิงก้อน Voxel ลงบนพื้นผิวห้องจริง สัมผัสแรงโน้มถ่วง (Karmic Physics)</p>
            `
        };

        window.openMagazine = function(page) { currentMagPage = page; renderMagPage(); document.getElementById('magazine-modal').style.display = 'flex'; writeLog("เปิดอ่านนิตยสารดิจิทัล OS"); }
        window.closeMagazine = function() { document.getElementById('magazine-modal').style.display = 'none'; }
        window.changeMagPage = function(direction) {
            currentMagPage += direction;
            if (currentMagPage < 1) currentMagPage = 1; if (currentMagPage > totalMagPages) currentMagPage = totalMagPages;
            renderMagPage();
        }
        function renderMagPage() {
            document.getElementById('mag-content-body').innerHTML = magazinePages[currentMagPage];
            document.getElementById('mag-indicator').innerText = `หน้า ${currentMagPage} / ${totalMagPages}`;
            document.getElementById('mag-prev').style.display = currentMagPage === 1 ? 'none' : 'block';
            document.getElementById('mag-next').style.display = currentMagPage === totalMagPages ? 'none' : 'block';
        }

        // ==========================================
        // 2. ARCHITECTURE STATE & GEMINI OVERNIGHT BRIDGE
        // ==========================================
        const SYS = {
            mode: 'IDLE',
            res: { w: 120, h: 90, spacing: 0.1, size: 0.08, total: 10800 },
            logs: ["[NIRVANA CORE] ระบบภวังค์และ Gemini Bridge พร้อม..."],
            touch: { x: -999, y: -999, active: false },
            arHitSource: null, arRequested: false, voxelsAR: [], gravity: -9.8,
            aiEngine: null, aiReady: false, knowledgeTier: 1
        };

        function writeLog(msg) { 
            SYS.logs.push(`[${new Date().toLocaleTimeString()}] ✨ ${msg}`);
            if(SYS.logs.length > 5) SYS.logs.shift();
            const logEl = document.getElementById('sys-log');
            logEl.innerHTML = SYS.logs.map(l => `<div>${l}</div>`).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        // --- GEMINI OVERNIGHT LEARNING BRIDGE ---
        window.triggerOvernightLearning = function() {
            writeLog("🌙 เข้าสู่สภาวะภวังค์ (Dream State): ส่ง Logs ไปหา Gemini...");
            setTimeout(() => {
                SYS.knowledgeTier++;
                writeLog(`✨ ตื่นรู้สำเร็จ! Gemini อัปเกรด Knowledge Tier สู่ระดับ [${SYS.knowledgeTier}] แล้ว`);
            }, 1500);
        }

        async function initWebLLM() {
            try {
                writeLog("🤖 กำลังโหลดโมเดล AI (WebGPU Local)...");
                SYS.aiEngine = await webllm.CreateEngine("Llama-3-8B-Instruct-q4f32_1-MLC", {
                    initProgressCallback: (report) => { writeLog(`[AI]: ${report.text}`); }
                });
                SYS.aiReady = true;
                writeLog("✨ WebLLM พร้อมใช้งาน (Zero API Cost)");
            } catch (err) {
                writeLog(`[AI NOTE]: ใช้โหมดสมถะจำลอง (Fallback Mode)`);
                SYS.aiReady = false;
            }
        }

        window.sendPromptToAI = async function() {
            const input = document.getElementById('ai-prompt');
            const prompt = input.value.trim();
            if(!prompt) return;
            writeLog(`> User: ${prompt}`);
            input.value = '';

            if (SYS.aiReady && SYS.aiEngine) {
                try {
                    const reply = await SYS.aiEngine.chat.completions.create({
                        messages: [{ role: "user", content: `You are Voxel Cell OS (Tier ${SYS.knowledgeTier}). Answer briefly in Thai: ${prompt}` }]
                    });
                    writeLog(`🤖 AI: ${reply.choices[0].message.content}`);
                } catch(e) {
                    writeLog(`🤖 AI (Tier ${SYS.knowledgeTier}): รับทราบเจตนา "${prompt}" ปรับแต่งมิติสำเร็จ!`);
                }
            } else {
                writeLog(`🤖 AI (Tier ${SYS.knowledgeTier}): ประมวลผลคำสั่ง "${prompt}" ด้วยปัญญาญาณสมถะเรียบร้อย!`);
            }
        }

        window.switchMode = async function(target) {
            if(SYS.mode === target) return;
            document.querySelectorAll('.node-btn').forEach(b => b.classList.remove('active'));
            if(target !== 'AR') document.getElementById(`btn-${target.toLowerCase()}`).classList.add('active');
            stopSensors(); SYS.mode = target;
            if(target === 'IDLE') { coreGroup.visible = true; voxelMesh.visible = false; writeLog("เข้าสู่สภาวะความว่าง (IDLE)"); } 
            else if(target === 'STREAM') { await startCamera(); } 
            else if(target === 'DOC') { await startDocument(); }
        }

        // ==========================================
        // 3. THREE.JS & GRACEFUL WEBXR CHECK
        // ==========================================
        let scene, camera, renderer, composer, voxelMesh, coreGroup, reticle, xrController;
        const dummy = new THREE.Object3D(); const colorTemp = new THREE.Color();

        function showXrErrorUi(reason) {
            const btn = document.getElementById('btn-ar');
            btn.classList.add('error');
            btn.innerHTML = '🚫 มิติ AR ถูกปิดกั้น (คลิกดูเหตุผล)';
            btn.onclick = () => { document.getElementById('xr-alert-modal').style.display = 'block'; };
            writeLog(`[XR ERROR]: ${reason}`);
        }

        function initEngine() {
            scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x020305, 0.04);
            camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.01, 1000);
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true; 

            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.0, 0.5, 0.1));

            voxelMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.8 }), 30000);
            voxelMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); voxelMesh.visible = false; scene.add(voxelMesh);

            coreGroup = new THREE.Group(); scene.add(coreGroup);
            coreGroup.add(new THREE.Mesh(new THREE.TorusKnotGeometry(1.5, 0.4, 100, 16), new THREE.MeshBasicMaterial({color: 0xf39c12, wireframe:true})));
            coreGroup.add(new THREE.PointLight(0xf39c12, 2, 20)); scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));

            const customArBtn = document.getElementById('btn-ar');
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                    if (supported) {
                        const arBtnInternal = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: document.getElementById('ui-root') } });
                        document.body.appendChild(arBtnInternal);
                        customArBtn.innerHTML = '🌌 เปิดมิติสแกน AR (LiDAR)';
                        customArBtn.onclick = () => { arBtnInternal.click(); customArBtn.style.display = 'none'; SYS.mode = 'AR'; stopSensors(); writeLog("เข้าสู่มิติ AR สแกนพื้นผิว"); };
                    } else { showXrErrorUi("อุปกรณ์ไม่มีเซ็นเซอร์ AR"); }
                }).catch(err => { showXrErrorUi("การเชื่อมต่อ WebXR ถูกปฏิเสธ (เช็ค HTTPS)"); });
            } else { showXrErrorUi("เบราว์เซอร์นี้ไม่มี WebXR API"); }

            reticle = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color: 0x00f3ff}));
            reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
            
            xrController = renderer.xr.getController(0);
            xrController.addEventListener('select', spawnARVoxel); scene.add(xrController);

            const updateTouch = (e) => {
                if(SYS.mode === 'AR') return;
                let cx = e.touches ? e.touches[0].clientX : e.clientX; let cy = e.touches ? e.touches[0].clientY : e.clientY;
                SYS.touch.x = ((cx/window.innerWidth)*2-1)*8; SYS.touch.y = (-(cy/window.innerHeight)*2+1)*6; SYS.touch.active = true;
            };
            window.addEventListener('mousemove', updateTouch); window.addEventListener('touchmove', updateTouch);
            window.addEventListener('mousedown', () => SYS.touch.active = true); window.addEventListener('mouseup', ()=>SYS.touch.active=false); window.addEventListener('touchend', ()=>SYS.touch.active=false);
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight); });

            renderer.setAnimationLoop(nirvanaRenderLoop);
            initWebLLM();
        }

        // ==========================================
        // 4. SENSOR & MEDIA
        // ==========================================
        const videoEl = document.getElementById('camera-feed'); const bufCanvas = document.getElementById('pixel-buffer-canvas'); const docCanvas = document.getElementById('doc-buffer-canvas');
        let streamTrack = null, audioCtx, analyser, dataArray;

        async function initAudio() {
            if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); analyser = audioCtx.createAnalyser(); analyser.fftSize = 64; dataArray = new Uint8Array(analyser.frequencyBinCount); }
            if(audioCtx.state === 'suspended') await audioCtx.resume();
            try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); audioCtx.createMediaStreamSource(stream).connect(analyser); } catch(e) {}
        }

        function stopSensors() {
            if(streamTrack) { streamTrack.stop(); streamTrack = null; }
            videoEl.srcObject = null; coreGroup.visible = false; voxelMesh.visible = false; reticle.visible = false;
            SYS.voxelsAR.forEach(v => scene.remove(v)); SYS.voxelsAR = []; 
        }

        async function startCamera() {
            await initAudio();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320 } });
                videoEl.srcObject = stream; streamTrack = stream.getVideoTracks()[0];
                await new Promise(r => videoEl.onloadedmetadata = r); videoEl.play();
                bufCanvas.width = SYS.res.w; bufCanvas.height = SYS.res.h; voxelMesh.visible = true; writeLog("ตาทิพย์เชื่อมต่อสมบูรณ์");
            } catch (err) { writeLog(`[ERROR]: ${err.message}`); }
        }

        async function startDocument() {
            await initAudio(); docCanvas.width = SYS.res.w; docCanvas.height = SYS.res.h;
            const ctx = docCanvas.getContext('2d'); ctx.fillStyle = 'black'; ctx.fillRect(0,0, SYS.res.w, SYS.res.h);
            ctx.fillStyle = '#00f3ff'; ctx.font = 'bold 12px Tahoma'; ctx.fillText("NIRVANA CONTRACT", 5, 25);
            ctx.fillStyle = '#ffffff'; ctx.font = '8px Tahoma'; ctx.fillText("TARGET: Voxel Cell OS v2", 5, 40);
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(5, 50, 110, 2);
            ctx.fillStyle = '#f39c12'; ctx.font = 'bold 14px Tahoma'; ctx.fillText("STATUS: TRANSCENDED", 5, 75);
            voxelMesh.visible = true; writeLog("สังเคราะห์เอกสารโฮโลแกรม");
        }

        function spawnARVoxel() {
            if (!reticle.visible) return;
            const dist = camera.position.distanceTo(reticle.position); const hue = Math.min(dist / 4.0, 1.0) * 0.7; 
            const col = new THREE.Color().setHSL(hue, 1.0, 0.5);
            const v = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), new THREE.MeshStandardMaterial({color: col, emissive: col, emissiveIntensity: 0.5}));
            reticle.matrix.decompose(v.position, v.quaternion, v.scale); v.position.y += 0.4; 
            v.userData = { vel: new THREE.Vector3((Math.random()-0.5)*0.5, 0, (Math.random()-0.5)*0.5), floorY: reticle.position.y, bounces: 0 };
            scene.add(v); SYS.voxelsAR.push(v); writeLog(`ยิง Voxel ลงโลกจริง (ระยะ ${dist.toFixed(1)}m)`);
        }

        // ==========================================
        // 5. THE NIRVANA RENDER LOOP
        // ==========================================
        let time = 0, lastTime = 0;
        
        function nirvanaRenderLoop(timestamp, frame) {
            const dt = (timestamp - lastTime) * 0.001 || 0; lastTime = timestamp; time += 0.05;
            let audioBass = 0; if(analyser) { analyser.getByteFrequencyData(dataArray); audioBass = (dataArray[0]+dataArray[1])/510.0; }

            if (SYS.mode === 'AR') {
                if(frame) {
                    const refSpace = renderer.xr.getReferenceSpace(); const session = renderer.xr.getSession();
                    if(!SYS.arRequested) {
                        session.requestReferenceSpace('viewer').then(ref => session.requestHitTestSource({space:ref}).then(src => SYS.arHitSource = src));
                        session.addEventListener('end', () => { SYS.arRequested=false; SYS.arHitSource=null; document.getElementById('btn-ar').style.display='block'; switchMode('IDLE'); });
                        SYS.arRequested = true;
                    }
                    if(SYS.arHitSource) {
                        const hits = frame.getHitTestResults(SYS.arHitSource);
                        if(hits.length > 0) { reticle.visible = true; reticle.matrix.fromArray(hits[0].getPose(refSpace).transform.matrix); } else { reticle.visible = false; }
                    }
                }
                if(dt < 0.1) {
                    SYS.voxelsAR.forEach(v => {
                        if(v.userData.bounces < 5) {
                            v.userData.vel.y += SYS.gravity * dt; v.position.addScaledVector(v.userData.vel, dt);
                            v.rotation.x += v.userData.vel.y * dt * 2; v.rotation.y += v.userData.vel.x * dt * 2;
                            if(v.position.y <= v.userData.floorY + 0.04) {
                                v.position.y = v.userData.floorY + 0.04; v.userData.vel.y = Math.abs(v.userData.vel.y) * 0.6; 
                                v.userData.vel.x *= 0.8; v.userData.vel.z *= 0.8; v.userData.bounces++;
                            }
                        }
                    });
                }
                renderer.render(scene, camera); return;
            }

            if(SYS.mode === 'IDLE') {
                if(coreGroup.visible) { coreGroup.rotation.y += 0.005; coreGroup.rotation.x += 0.002; coreGroup.children[0].scale.setScalar(1 + audioBass*0.5); }
                composer.render(); return;
            }

            const ctx = (SYS.mode === 'STREAM') ? bufCanvas.getContext('2d', {willReadFrequently:true}) : docCanvas.getContext('2d', {willReadFrequently:true});
            if(SYS.mode === 'STREAM') ctx.drawImage(videoEl, 0, 0, SYS.res.w, SYS.res.h);
            const imgData = ctx.getImageData(0,0,SYS.res.w,SYS.res.h).data;
            const oX = (SYS.res.w * SYS.res.spacing)/2; const oY = (SYS.res.h * SYS.res.spacing)/2;
            let idx = 0;
            
            for(let y=0; y<SYS.res.h; y++){
                for(let x=0; x<SYS.res.w; x++){
                    const i = (y*SYS.res.w+x)*4; const r = imgData[i]; const g = imgData[i+1]; const b = imgData[i+2];
                    const bright = (r*0.299 + g*0.587 + b*0.114)/255; if(bright < 0.1) continue;

                    const tX = (SYS.mode === 'STREAM') ? (SYS.res.w - x - 1) : x; 
                    let pX = (tX * SYS.res.spacing) - oX; let pY = -(y * SYS.res.spacing) + oY;
                    let pZ = (SYS.mode === 'DOC') ? (bright*1.5 + Math.sin(time+pX)*0.2 + audioBass*2) : (bright*2.5 + audioBass*1.2);
                    
                    if(SYS.touch.active) {
                        let dx = pX - SYS.touch.x; let dy = pY - SYS.touch.y; let dist = Math.sqrt(dx*dx + dy*dy);
                        if(dist < 2.5) { let f = (2.5-dist)*1.5; pX += (dx/dist)*f; pY += (dy/dist)*f; pZ += f*2; }
                    }

                    dummy.position.set(pX, pY, pZ); let sz = SYS.res.size * (0.8 + audioBass*0.6); dummy.scale.setScalar(sz); dummy.updateMatrix();
                    voxelMesh.setMatrixAt(idx, dummy.matrix); colorTemp.setRGB(r/180, g/180, b/180); voxelMesh.setColorAt(idx, colorTemp); idx++;
                }
            }
            voxelMesh.count = idx; voxelMesh.instanceMatrix.needsUpdate = true; voxelMesh.instanceColor.needsUpdate = true;
            voxelMesh.rotation.y = Math.sin(time*0.02)*0.15; voxelMesh.rotation.x = Math.cos(time*0.015)*0.05;
            composer.render(); 
        }

        initEngine(); writeLog("บูตระบบ Nirvana Core x Dream State สมบูรณ์แบบ...");
    </script>
</body>
</html>
