<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel OS: Quantum Typography</title>
    <style>
        :root {
            --bg-color: #010203;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(0, 243, 255, 0.02));
            --glass-border: 1px solid rgba(0, 243, 255, 0.2);
            --cyan-core: #00f3ff; --gold-core: #f39c12; --magenta-core: #ff00ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: white; user-select: none; touch-action: none; }
        
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        
        /* 💎 SHADOW DOM (The Layout Oracle) - ซ่อนไว้คำนวณตัดคำภาษาไทย */
        #shadow-dom {
            position: absolute; top: -9999px; left: -9999px; 
            width: 320px; /* ขอบเขตหน้ากระดาษจำลอง */
            font-size: 24px; font-weight: bold; line-height: 1.5;
            word-wrap: break-word; color: white; visibility: hidden;
        }

        /* 💎 ULTRA GLASSMORPHISM UI */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; pointer-events: auto; }
        .glass-pill { background: rgba(0,0,0,0.3); border: var(--glass-border); padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-weight: bold; }
        
        .hud-panel {
            background: var(--glass-bg); border: var(--glass-border); border-top: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
            padding: 20px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); pointer-events: auto;
            max-width: 400px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 12px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; color: var(--gold-core); font-weight: bold; text-shadow: 0 0 10px var(--gold-core); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-glass { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: white; 
            padding: 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: all 0.3s; 
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        .btn-glass:hover { background: rgba(0, 243, 255, 0.15); border-color: var(--cyan-core); box-shadow: 0 0 15px rgba(0,243,255,0.3); }
        .btn-glass.active { background: rgba(243, 156, 18, 0.2); border-color: var(--gold-core); color: var(--gold-core); text-shadow: 0 0 10px var(--gold-core); }

        .log-box { font-family: 'Courier New', monospace; font-size: 0.65rem; color: #aaa; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; height: 60px; overflow-y: auto; }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div id="shadow-dom"></div> <!-- ร่างทรงสำหรับตัดคำ -->

    <div id="ui-layer">
        <div class="top-bar">
            <div class="glass-pill" style="color:var(--cyan-core);">Voxel OS : Rebirth</div>
            <div class="glass-pill" id="telemetry">FPS: --</div>
        </div>

        <div class="hud-panel">
            <div class="header">🪷 NIRVANA SPATIAL CORE</div>
            
            <div class="btn-grid">
                <button class="btn-glass active" id="btn-zen" onclick="switchState('ZEN')">🧘‍♂️ สภาวะฌาน (Idle)</button>
                <button class="btn-glass" id="btn-mag" onclick="switchState('MAGAZINE')">📖 นิตยสาร 3D (Voxel)</button>
                <button class="btn-glass" onclick="switchTheme()">🎨 สลับอายตนะ (Theme)</button>
                <button class="btn-glass" onclick="logMsg('ส่งกระแสจิตสำเร็จ')">🍄 ซิงค์ไมโครไรซา</button>
            </div>

            <div class="log-box" id="sys-log">
                <div>[System] บูตโครงสร้างข้อมูล Float32Array...</div>
                <div>[System] เตรียมพร้อมร่ายเวทย์ GPU Shader...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- GLOBAL STATE ---
        const SYS = { state: 'ZEN', theme: 'CYAN', logs: [] };
        function logMsg(msg) {
            SYS.logs.push(`> ${msg}`); if(SYS.logs.length > 4) SYS.logs.shift();
            document.getElementById('sys-log').innerHTML = SYS.logs.map(l => `<div>${l}</div>`).join('');
        }
        window.logMsg = logMsg;

        // --- THREE.JS ENGINE ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010203, 0.05);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.0, 0.5, 0.1);
        composer.addPass(bloomPass);

        // --- THEME ENGINE ---
        const themes = {
            CYAN: { color: 0x00f3ff, bloom: 2.0, bg: 0x010203 },
            CYBER: { color: 0xff00ff, bloom: 2.5, bg: 0x1a001a }
        };
        window.switchTheme = () => {
            SYS.theme = SYS.theme === 'CYAN' ? 'CYBER' : 'CYAN';
            const t = themes[SYS.theme];
            scene.fog.color.setHex(t.bg);
            document.body.style.backgroundColor = `#${t.bg.toString(16).padStart(6,'0')}`;
            bloomPass.strength = t.bloom;
            coreMat.color.setHex(t.color); textMat.color.setHex(t.color); textMat.emissive.setHex(t.color);
            logMsg(`เปลี่ยนสภาวะสีเป็น ${SYS.theme}`);
        };

        // --- 3D CORE (IDLE SHAPE) ---
        const coreMat = new THREE.MeshBasicMaterial({ color: themes.CYAN.color, wireframe: true, transparent: true, opacity: 0.6 });
        const coreShape = new THREE.Mesh(new THREE.TorusKnotGeometry(2, 0.6, 100, 16), coreMat);
        scene.add(coreShape);

        // --- VOXEL TYPOGRAPHY (THE GPU SHADER MAGIC) ---
        const MAX_VOXELS = 4000; 
        const voxelGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08); // ก้อน Voxel เล็กๆ
        const textMat = new THREE.MeshStandardMaterial({ color: themes.CYAN.color, emissive: themes.CYAN.color, emissiveIntensity: 1.0, roughness: 0.2 });
        
        // 💎 หัวใจสำคัญ: ส่ง Uniform และ Attribute เข้า GPU
        const shaderUniforms = {
            uTime: { value: 0 },
            uMorph: { value: 0.0 } // 0 = ลอยสุ่ม, 1 = รวมร่างเป็นตัวหนังสือ
        };

        textMat.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = shaderUniforms.uTime;
            shader.uniforms.uMorph = shaderUniforms.uMorph;
            // รับค่าพิกัดเป้าหมาย (targetPos) และพิกัดสุ่ม (randomPos) จาก Float32Array
            shader.vertexShader = `
                uniform float uTime;
                uniform float uMorph;
                attribute vec3 aTargetPos;
                attribute vec3 aRandomPos;
            ` + shader.vertexShader;
            
            // แทรกสมการคณิตศาสตร์ลงใน Vertex Shader
            shader.vertexShader = shader.vertexShader.replace(
                `#include <begin_vertex>`,
                `
                // 1. สมการพิกัดลอยสุ่ม (Idle State)
                vec3 idlePos = aRandomPos + vec3(sin(uTime * 2.0 + aRandomPos.x), cos(uTime * 1.5 + aRandomPos.y), sin(uTime + aRandomPos.z)) * 0.5;
                
                // 2. สมการคลื่นโฮโลแกรมสำหรับตัวอักษร (Z-Wave)
                float zWave = sin(aTargetPos.x * 2.0 - uTime * 4.0) * 0.2;
                vec3 textPos = vec3(aTargetPos.x, aTargetPos.y, aTargetPos.z + zWave);

                // 3. สมการรวมร่าง (Lerp Kinetic Morphing)
                vec3 transformed = mix(idlePos, textPos, uMorph);
                `
            );
        };

        const voxelMesh = new THREE.InstancedMesh(voxelGeo, textMat, MAX_VOXELS);
        
        // 💎 โครงสร้างข้อมูล Float32Array ดิบเพื่อลดคอขวด CPU
        const targetPosArray = new Float32Array(MAX_VOXELS * 3);
        const randomPosArray = new Float32Array(MAX_VOXELS * 3);
        
        // สุ่มพิกัดเริ่มต้นให้อยู่รอบๆ แกนกลาง
        const dummy = new THREE.Object3D();
        for(let i=0; i<MAX_VOXELS; i++) {
            dummy.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
            dummy.updateMatrix();
            voxelMesh.setMatrixAt(i, dummy.matrix);
            
            randomPosArray[i*3] = dummy.position.x;
            randomPosArray[i*3+1] = dummy.position.y;
            randomPosArray[i*3+2] = dummy.position.z;
        }
        
        voxelMesh.geometry.setAttribute('aTargetPos', new THREE.InstancedBufferAttribute(targetPosArray, 3));
        voxelMesh.geometry.setAttribute('aRandomPos', new THREE.InstancedBufferAttribute(randomPosArray, 3));
        voxelMesh.visible = false;
        scene.add(voxelMesh);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // --- SHADOW DOM LAYOUT ORACLE (ตัดคำภาษาไทย) ---
        const sampleText = "ปัญญาญาณแห่งระบบ สมมติบัญญัติ สู่ปรมัตถธรรม Voxel Cell OS สถาปัตยกรรมที่ก้าวข้ามขีดจำกัดของมิติ ผสานฟิสิกส์และศิลปะเข้าเป็นหนึ่งเดียว.";
        
        function bakeTextToVoxels(text) {
            logMsg("กำลังเบิกเนตร Shadow DOM ตัดคำภาษาไทย...");
            const sd = document.getElementById('shadow-dom');
            sd.innerHTML = ''; 
            
            // แยกตัวอักษรใส่ span เพื่อดึงพิกัด (ใช้เบราว์เซอร์ช่วยตัดคำอัตโนมัติ)
            for(let char of text) {
                if(char === ' ') sd.innerHTML += '<span>&nbsp;</span>';
                else sd.innerHTML += `<span>${char}</span>`;
            }
            
            // รอเบราว์เซอร์ Render แป๊บเดียว
            setTimeout(() => {
                const spans = sd.querySelectorAll('span');
                const sdRect = sd.getBoundingClientRect();
                
                let voxelIdx = 0;
                spans.forEach((span) => {
                    if(span.innerText.trim() === '' || voxelIdx >= MAX_VOXELS) return;
                    
                    const rect = span.getBoundingClientRect();
                    // แปลงพิกัด 2D หน้าจอ เป็นพิกัด 3D WebGL (จัดกึ่งกลาง)
                    // Scale down the rect coordinates to fit in 3D space
                    const scale = 0.05; 
                    const x3d = (rect.left - sdRect.left - (sdRect.width/2)) * scale;
                    const y3d = -(rect.top - sdRect.top - (sdRect.height/2)) * scale + 2.0; // ยกขึ้นนิดนึง
                    
                    // บันทึกลง Float32Array (กราฟข้อมูล)
                    // เราจะให้ 1 ตัวอักษรใช้ Voxel ประมาณ 4-5 ก้อนประกอบกันเพื่อความหนาแน่น
                    for(let v=0; v<5; v++) {
                        if(voxelIdx >= MAX_VOXELS) break;
                        targetPosArray[voxelIdx*3]     = x3d + (Math.random()-0.5)*0.1;
                        targetPosArray[voxelIdx*3 + 1] = y3d + (Math.random()-0.5)*0.1;
                        targetPosArray[voxelIdx*3 + 2] = (Math.random()-0.5)*0.1; // ความหนาตัวอักษร
                        voxelIdx++;
                    }
                });
                
                // อัปเดตข้อมูลขึ้นการ์ดจอ (Upload to GPU)
                voxelMesh.geometry.attributes.aTargetPos.needsUpdate = true;
                voxelMesh.count = voxelIdx; // เรนเดอร์เฉพาะเท่าที่ใช้
                
                logMsg(`อบพิกัดเสร็จสิ้น: ${voxelIdx} อนุภาค. เข้าสู่โหมดนิตยสาร`);
                
            }, 50);
        }

        // --- STATE MANAGER ---
        let targetMorph = 0.0;
        window.switchState = (state) => {
            if(SYS.state === state) return;
            document.querySelectorAll('.btn-glass').forEach(b => b.classList.remove('active'));
            document.getElementById(state === 'ZEN' ? 'btn-zen' : 'btn-mag').classList.add('active');
            
            SYS.state = state;
            if(state === 'ZEN') {
                targetMorph = 0.0; // สั่ง Voxel กระจายตัว
                coreShape.visible = true; // เปิดแกนกลาง
                logMsg("เข้าสู่สภาวะฌาน (ดวงจิตกระจายตัว)");
            } else if (state === 'MAGAZINE') {
                voxelMesh.visible = true;
                bakeTextToVoxels(sampleText); // อบตัวอักษร
                targetMorph = 1.0; // สั่ง Voxel รวมร่าง
                coreShape.visible = false; // ซ่อนแกนกลาง
            }
        };

        // --- RENDER LOOP ---
        const clock = new THREE.Clock();
        let frameCount = 0; let fpsTimer = 0;

        function render() {
            requestAnimationFrame(render);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Telemetry
            frameCount++; fpsTimer += delta;
            if (fpsTimer >= 1.0) { document.getElementById('telemetry').innerText = `FPS: ${frameCount}`; frameCount = 0; fpsTimer = 0; }

            // 1. หมุนแกนกลาง (Idle State)
            if(coreShape.visible) {
                coreShape.rotation.x += delta * 0.5;
                coreShape.rotation.y += delta * 0.8;
                const pulse = 1.0 + Math.sin(time * 2.0) * 0.1;
                coreShape.scale.set(pulse, pulse, pulse);
            }

            // 2. แอนิเมชัน Voxel Typography (Shader Magic)
            if(voxelMesh.visible) {
                // อัปเดตเวลาให้ GPU
                shaderUniforms.uTime.value = time;
                // Lerp ค่า Morphing เพื่อให้ Voxel ค่อยๆ วิ่งมารวมกันนุ่มๆ
                shaderUniforms.uMorph.value += (targetMorph - shaderUniforms.uMorph.value) * delta * 2.5;
                
                // ให้กลุ่มก้อนข้อความหมุนเอื่อยๆ กลางอวกาศ
                voxelMesh.rotation.y = Math.sin(time * 0.5) * 0.2;
                voxelMesh.rotation.x = Math.cos(time * 0.3) * 0.1;
                
                // ซ่อนเมื่อกระจายตัวเสร็จ
                if(SYS.state === 'ZEN' && shaderUniforms.uMorph.value < 0.05) voxelMesh.visible = false;
            }

            composer.render();
        }

        // Boot System
        render();
        logMsg("ระบบพร้อมรับการบัญชาจาก Chief Architect");
    </script>
</body>
</html>
